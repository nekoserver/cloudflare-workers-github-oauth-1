<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Paris & Rome — 同心円都市グラフ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#e6edf3; font-family:'Segoe UI',sans-serif; overflow:hidden; width:100vw; height:100vh; }
canvas { display:block; cursor:grab; }
#legend {
  position:absolute; top:20px; left:20px;
  background:rgba(22,27,34,0.88); border:1px solid #30363d;
  border-radius:8px; padding:14px 18px; font-size:12px; line-height:1.9;
  backdrop-filter:blur(4px);
}
#legend h2 { font-size:14px; font-weight:700; color:#58a6ff; margin-bottom:8px; }
.leg-row { display:flex; align-items:center; gap:8px; }
.leg-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.leg-line { width:26px; height:2px; flex-shrink:0; }
#info {
  position:absolute; bottom:18px; right:18px;
  background:rgba(22,27,34,0.88); border:1px solid #30363d;
  border-radius:8px; padding:9px 13px; font-size:11px; color:#8b949e;
  line-height:1.8; backdrop-filter:blur(4px);
}
#tooltip {
  position:absolute; pointer-events:none;
  background:rgba(13,17,23,0.96); border:1px solid #58a6ff55;
  border-radius:7px; padding:9px 13px; font-size:12px;
  display:none; z-index:10; max-width:220px;
}
#tt-name { font-weight:700; color:#e6edf3; margin-bottom:3px; }
#tt-dist { color:#8b949e; line-height:1.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="legend">
  <h2>Paris &amp; Rome — 同心円都市グラフ</h2>
  <div class="leg-row"><div class="leg-dot" style="background:#ff7b72;box-shadow:0 0 7px #ff7b72aa"></div><span>起点都市（パリ / ローマ）</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#79c0ff;box-shadow:0 0 6px #79c0ffaa"></div><span>500 km 圏内のみ</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#d2a8ff;box-shadow:0 0 6px #d2a8ffaa"></div><span>1000 km 圏内のみ</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#3fb950;box-shadow:0 0 6px #3fb950aa"></div><span>両圏に含まれる都市</span></div>
  <div style="margin-top:8px;border-top:1px solid #30363d;padding-top:8px;">
    <div class="leg-row"><div class="leg-line" style="background:#58a6ff"></div><span>パリ圏エッジ</span></div>
    <div class="leg-row"><div class="leg-line" style="background:#bc8cff"></div><span>ローマ圏エッジ</span></div>
    <div class="leg-row"><div class="leg-line" style="background:#3fb950"></div><span>共通圏エッジ</span></div>
    <div style="margin-top:6px;font-size:11px;color:#8b949e;">
      実線: 500km圏 &nbsp;/&nbsp; 破線: 1000km圏
    </div>
  </div>
</div>
<div id="info">
  マウスオーバー: 都市詳細 &nbsp;|&nbsp; ドラッグ: パン &nbsp;|&nbsp; ホイール: ズーム<br>
  同心円 — パリ: <span style="color:#58a6ff">青</span> &nbsp;/&nbsp; ローマ: <span style="color:#bc8cff">紫</span>
</div>
<div id="tooltip"><div id="tt-name"></div><div id="tt-dist"></div></div>
<script>
var CITIES = [
  { name:'Paris',      lat:48.8566,  lon:2.3522,   label:'パリ' },
  { name:'Rome',       lat:41.9028,  lon:12.4964,  label:'ローマ' },
  { name:'London',     lat:51.5074,  lon:-0.1278,  label:'ロンドン' },
  { name:'Amsterdam',  lat:52.3676,  lon:4.9041,   label:'アムステルダム' },
  { name:'Brussels',   lat:50.8503,  lon:4.3517,   label:'ブリュッセル' },
  { name:'Berlin',     lat:52.5200,  lon:13.4050,  label:'ベルリン' },
  { name:'Munich',     lat:48.1351,  lon:11.5820,  label:'ミュンヘン' },
  { name:'Vienna',     lat:48.2082,  lon:16.3738,  label:'ウィーン' },
  { name:'Zurich',     lat:47.3769,  lon:8.5417,   label:'チューリッヒ' },
  { name:'Geneva',     lat:46.2044,  lon:6.1432,   label:'ジュネーブ' },
  { name:'Lyon',       lat:45.7640,  lon:4.8357,   label:'リヨン' },
  { name:'Marseille',  lat:43.2965,  lon:5.3698,   label:'マルセイユ' },
  { name:'Barcelona',  lat:41.3851,  lon:2.1734,   label:'バルセロナ' },
  { name:'Madrid',     lat:40.4168,  lon:-3.7038,  label:'マドリード' },
  { name:'Milan',      lat:45.4642,  lon:9.1900,   label:'ミラノ' },
  { name:'Florence',   lat:43.7696,  lon:11.2558,  label:'フィレンツェ' },
  { name:'Naples',     lat:40.8518,  lon:14.2681,  label:'ナポリ' },
  { name:'Venice',     lat:45.4408,  lon:12.3155,  label:'ヴェネツィア' },
  { name:'Turin',      lat:45.0703,  lon:7.6869,   label:'トリノ' },
  { name:'Frankfurt',  lat:50.1109,  lon:8.6821,   label:'フランクフルト' },
  { name:'Hamburg',    lat:53.5511,  lon:9.9937,   label:'ハンブルク' },
  { name:'Prague',     lat:50.0755,  lon:14.4378,  label:'プラハ' },
  { name:'Budapest',   lat:47.4979,  lon:19.0402,  label:'ブダペスト' },
  { name:'Athens',     lat:37.9838,  lon:23.7275,  label:'アテネ' },
  { name:'Zagreb',     lat:45.8150,  lon:15.9819,  label:'ザグレブ' },
  { name:'Ljubljana',  lat:46.0569,  lon:14.5058,  label:'リュブリャナ' },
  { name:'Bern',       lat:46.9480,  lon:7.4474,   label:'ベルン' },
  { name:'Stuttgart',  lat:48.7758,  lon:9.1829,   label:'シュトゥットガルト' },
  { name:'Cologne',    lat:50.9333,  lon:6.9500,   label:'ケルン' },
  { name:'Bordeaux',   lat:44.8378,  lon:-0.5792,  label:'ボルドー' },
  { name:'Toulouse',   lat:43.6047,  lon:1.4442,   label:'トゥールーズ' },
  { name:'Nice',       lat:43.7102,  lon:7.2620,   label:'ニース' },
  { name:'Palermo',    lat:38.1157,  lon:13.3615,  label:'パレルモ' },
  { name:'Bologna',    lat:44.4949,  lon:11.3426,  label:'ボローニャ' },
  { name:'Genoa',      lat:44.4056,  lon:8.9463,   label:'ジェノヴァ' },
  { name:'Lisbon',     lat:38.7223,  lon:-9.1393,  label:'リスボン' },
  { name:'Warsaw',     lat:52.2297,  lon:21.0122,  label:'ワルシャワ' },
  { name:'Bratislava', lat:48.1486,  lon:17.1077,  label:'ブラチスラヴァ' },
  { name:'Sarajevo',   lat:43.8476,  lon:18.3564,  label:'サラエボ' },
  { name:'Valletta',   lat:35.8997,  lon:14.5147,  label:'ヴァレッタ' },
];

var PARIS = CITIES[0], ROME = CITIES[1];
var R1 = 500, R2 = 1000;

function haversine(a, b) {
  var R = 6371;
  var dLat = (b.lat - a.lat) * Math.PI / 180;
  var dLon = (b.lon - a.lon) * Math.PI / 180;
  var x = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
    Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.asin(Math.sqrt(x));
}

CITIES.forEach(function(c) {
  c.dParis = haversine(PARIS, c);
  c.dRome  = haversine(ROME,  c);
  c.inP1 = c.dParis <= R1;
  c.inP2 = c.dParis <= R2;
  c.inR1 = c.dRome  <= R1;
  c.inR2 = c.dRome  <= R2;
});

// equirectangular projection tuned for Europe
var LON_MIN = -12, LON_MAX = 28, LAT_MIN = 34, LAT_MAX = 58;
function project(lat, lon) {
  var cosLat = Math.cos((LAT_MIN + LAT_MAX) / 2 * Math.PI / 180);
  return {
    x: (lon - LON_MIN) / ((LON_MAX - LON_MIN)),
    y: 1 - (lat - LAT_MIN) / ((LAT_MAX - LAT_MIN))
  };
}

CITIES.forEach(function(c) {
  var p = project(c.lat, c.lon);
  c.nx = p.x; c.ny = p.y;
});

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var tooltip = document.getElementById('tooltip');
var ttName = document.getElementById('tt-name');
var ttDist = document.getElementById('tt-dist');

var W, H, scale, ox, oy;
var panX = 0, panY = 0, zoom = 1;
var dragging = false, dragStart, panStart;
var hoveredCity = null;
var raf;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  var aspect = (LON_MAX - LON_MIN) / (LAT_MAX - LAT_MIN);
  var pad = 100;
  if ((W - pad*2) / aspect < H - pad*2) {
    scale = (W - pad*2) / aspect;
    ox = pad;
    oy = (H - scale) / 2;
  } else {
    scale = H - pad*2;
    ox = (W - scale * aspect) / 2;
    oy = pad;
  }
  // initial pan to center
  if (panX === 0 && panY === 0) {
    panX = 0; panY = 0;
  }
}

function toScreen(nx, ny) {
  var aspect = (LON_MAX - LON_MIN) / (LAT_MAX - LAT_MIN);
  return {
    x: ox + nx * scale * aspect * zoom + panX,
    y: oy + ny * scale * zoom + panY
  };
}

function kmToScreenPx(city, km) {
  var R = 6371;
  var dLat = km / R * 180 / Math.PI;
  var pC = project(city.lat, city.lon);
  var pE = project(city.lat + dLat, city.lon);
  return Math.abs((pE.y - pC.y) * scale * zoom);
}

function drawGlowCircle(x, y, r, color, alpha, dash) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = alpha;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.restore();
}

function drawEdge(a, b, color, alpha, dash) {
  var sa = toScreen(a.nx, a.ny);
  var sb = toScreen(b.nx, b.ny);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(sa.x, sa.y);
  ctx.lineTo(sb.x, sb.y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = alpha;
  if (dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // subtle grid
  ctx.save();
  ctx.strokeStyle = '#161b22';
  ctx.lineWidth = 1;
  for (var gx = 0; gx < W; gx += 60) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for (var gy = 0; gy < H; gy += 60) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
  ctx.restore();

  // concentric circles
  var sc_paris = toScreen(PARIS.nx, PARIS.ny);
  var sc_rome  = toScreen(ROME.nx,  ROME.ny);
  drawGlowCircle(sc_paris.x, sc_paris.y, kmToScreenPx(PARIS, R1), '#58a6ff', 0.45, [7,5]);
  drawGlowCircle(sc_paris.x, sc_paris.y, kmToScreenPx(PARIS, R2), '#58a6ff', 0.25, [3,7]);
  drawGlowCircle(sc_rome.x,  sc_rome.y,  kmToScreenPx(ROME,  R1), '#bc8cff', 0.45, [7,5]);
  drawGlowCircle(sc_rome.x,  sc_rome.y,  kmToScreenPx(ROME,  R2), '#bc8cff', 0.25, [3,7]);

  // edges
  var visible = CITIES.filter(function(c) {
    return c.name === 'Paris' || c.name === 'Rome' || c.inP2 || c.inR2;
  });

  for (var i = 0; i < visible.length; i++) {
    for (var j = i+1; j < visible.length; j++) {
      var a = visible[i], b = visible[j];
      var sa = toScreen(a.nx, a.ny);
      var sb = toScreen(b.nx, b.ny);
      var screenDist = Math.hypot(sa.x-sb.x, sa.y-sb.y);
      if (screenDist > 280 * zoom) continue;

      var bothP = (a.inP2 || a.name==='Paris') && (b.inP2 || b.name==='Paris');
      var bothR = (a.inR2 || a.name==='Rome')  && (b.inR2 || b.name==='Rome');
      var p1edge = (a.inP1 || a.name==='Paris') && (b.inP1 || b.name==='Paris');
      var r1edge = (a.inR1 || a.name==='Rome')  && (b.inR1 || b.name==='Rome');

      if (bothP && bothR) {
        drawEdge(a, b, '#3fb950', p1edge||r1edge ? 0.5 : 0.2, null);
      } else if (bothP) {
        drawEdge(a, b, '#58a6ff', p1edge ? 0.45 : 0.18, p1edge ? null : [3,5]);
      } else if (bothR) {
        drawEdge(a, b, '#bc8cff', r1edge ? 0.45 : 0.18, r1edge ? null : [3,5]);
      }
    }
  }

  // nodes
  visible.forEach(function(c) {
    var sc = toScreen(c.nx, c.ny);
    var isAnchor = (c.name === 'Paris' || c.name === 'Rome');
    var inBoth = !isAnchor && (c.inP2 || c.inP1) && (c.inR2 || c.inR1);
    var in1only = !isAnchor && !inBoth && (c.inP1 || c.inR1);

    var color, glow, r;
    if (isAnchor)     { color='#ff7b72'; glow='#ff7b7288'; r=10; }
    else if (inBoth)  { color='#3fb950'; glow='#3fb95066'; r=6;  }
    else if (in1only) { color='#79c0ff'; glow='#79c0ff66'; r=5;  }
    else              { color='#d2a8ff'; glow='#d2a8ff55'; r=4;  }

    var isHover = hoveredCity && hoveredCity.name === c.name;
    if (isHover) { r *= 1.5; }

    // glow halo
    ctx.save();
    var g = ctx.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, r * 3);
    g.addColorStop(0, glow);
    g.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, r * 3, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    // node dot
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, r, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();

    // label
    var fs = isAnchor ? 13 : (zoom > 1.2 ? 12 : 11);
    ctx.font = (isAnchor ? '700' : '400') + ' ' + fs + 'px "Segoe UI",sans-serif';
    ctx.fillStyle = isHover ? '#ffffff' : (isAnchor ? color : '#c9d1d9');
    ctx.globalAlpha = isHover ? 1 : (isAnchor ? 1 : 0.82);
    ctx.fillText(c.label, sc.x + r + 5, sc.y + 4);
    ctx.globalAlpha = 1;
  });

  raf = requestAnimationFrame(draw);
}

// events
canvas.addEventListener('mousedown', function(e) {
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  panStart  = { x: panX, y: panY };
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', function(e) {
  if (dragging) {
    panX = panStart.x + (e.clientX - dragStart.x);
    panY = panStart.y + (e.clientY - dragStart.y);
    return;
  }
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  hoveredCity = null;
  var visible = CITIES.filter(function(c) {
    return c.name==='Paris'||c.name==='Rome'||c.inP2||c.inR2;
  });
  for (var i = 0; i < visible.length; i++) {
    var sc = toScreen(visible[i].nx, visible[i].ny);
    if (Math.hypot(sc.x-mx, sc.y-my) < 16) { hoveredCity = visible[i]; break; }
  }
  if (hoveredCity) {
    canvas.style.cursor = 'pointer';
    var c = hoveredCity;
    ttName.textContent = c.label + '（' + c.name + '）';
    var lines = [];
    if (c.name==='Paris') lines.push('起点都市');
    else if (c.name==='Rome') lines.push('起点都市');
    else {
      if (c.inP2) lines.push('パリから ' + Math.round(c.dParis) + ' km' + (c.inP1 ? '（500km圏）' : '（1000km圏）'));
      if (c.inR2) lines.push('ローマから ' + Math.round(c.dRome) + ' km' + (c.inR1 ? '（500km圏）' : '（1000km圏）'));
    }
    ttDist.innerHTML = lines.join('<br>');
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top  = (e.clientY - 8)  + 'px';
  } else {
    canvas.style.cursor = 'grab';
    tooltip.style.display = 'none';
  }
});
window.addEventListener('mouseup', function() {
  dragging = false;
  canvas.style.cursor = 'grab';
});
canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  var factor = e.deltaY < 0 ? 1.12 : 0.89;
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx + (panX - mx) * factor;
  panY = my + (panY - my) * factor;
  zoom = Math.max(0.3, Math.min(zoom * factor, 8));
}, { passive: false });
window.addEventListener('resize', resize);

resize();
draw();
</script>
</body>
</html>
