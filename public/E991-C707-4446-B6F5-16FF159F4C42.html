<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立方体の展開図から四面体</title><style>*{box-sizing:border-box}body{margin:0;background:#111;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}.panel{width:min(96vw,620px);background:#fff;border-radius:14px;padding:14px;color:#202630}h2{font-size:clamp(16px,4vw,23px);text-align:center;margin:0 0 10px;border-bottom:3px solid #43a9b9;padding-bottom:10px}#view{height: min(65vh,620px);min-height:280px;position:relative;background:#edf0f3;border-radius:14px;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block}#msg{position:absolute;top:14px;width:100%;text-align:center;font-size:13px;font-weight:bold;pointer-events:none}#labels{position:absolute;inset:0;pointer-events:none}.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#d73d65;transform:translate(-50%,-50%)}.dot b{position:absolute;left:8px;bottom:5px;font-size:13px}.controls{display:flex;align-items:center;gap:10px;margin-top:12px}button{border:0;border-radius:30px;padding:12px 16px;background:#e9eef0;font-weight:bold;cursor:pointer}#toggle{background:#d83b65;color:white;white-space:nowrap}input{flex:1;min-width:0;accent-color:#d83b65}html,body{width:100%;height:100%;overflow:hidden}body{display:block}.panel{width:100%;height:100%;height:100dvh;border-radius:0;display:flex;flex-direction:column;padding:8px;gap:6px}h2{margin:0;padding:4px;font-size:16px}#view{flex:1;min-height:0;height:auto;border-radius:0} .controls{margin:0;flex-wrap:wrap;gap:6px;padding-bottom:env(safe-area-inset-bottom)}button{padding:10px 12px}#range{min-width:90px}#hint{font-size:11px;text-align:center;color:#555}canvas{touch-action:none}</style><div class="panel"><h2>立方体の展開図を折ると、四面体に！</h2><div id="view"><svg id="fallback" viewBox="-1.3 -2.3 4.6 3.6" style="position:absolute;inset:0;width:100%;height:100%"><g stroke="#333" stroke-width=".025" stroke-linejoin="round"><polygon fill="#66bd91" points="0,0 1,0 0,-2"/><polygon fill="#ff7a73" points="0,-2 1,0 3,0 1.5,-1 1,-1 1,-1.333"/><polygon fill="#ffc25c" points="0,0 .5,1 1,1 1,0"/><polygon fill="#70abf7" points="0,0 0,1 .5,1"/><polygon fill="#70abf7" points="0,0 -1,0 -1,-.5 -.667,-1 0,-1"/><polygon fill="#ff7a73" points="-1,-.5 -1,-1 -.667,-1"/><polygon fill="#70abf7" points="0,-2 1,-1.333 1,-2"/><polygon fill="#70abf7" points="3,0 2.5,-1 1.5,-1"/><polygon fill="#ffc25c" points="3,0 3,-1 2.5,-1"/></g></svg><canvas style="position:relative"></canvas><div id="msg">展開図（操作にはJavaScript対応ブラウザが必要です）</div><div id="labels"></div></div><div class="controls"><button id="back">◀</button><input id="range" type="range" min="0" max="1000" value="0"><button id="next">▶</button><button id="toggle">組み立て</button><button id="full">全画面</button><button id="reset">視点リセット</button></div><div id="hint">1本指：回転 / 2本指：拡大・縮小 / スライダー：折りたたみ</div></div><script>
let canvas=document.querySelector('canvas'),gl=null;try{gl=canvas.getContext('webgl',{antialias:true})}catch(e){} let ctx=null;if(!gl){const replacement=canvas.cloneNode();canvas.replaceWith(replacement);canvas=replacement;ctx=canvas.getContext('2d');}const msg=document.querySelector('#msg'),range=document.querySelector('#range'),toggle=document.querySelector('#toggle');
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>mul(a,1/Math.hypot(...a)),p=(x,y)=>[x,y,0];
function rot(v,a,b,t){let u=unit(sub(b,a)),q=sub(v,a);return add(a,add(add(mul(q,Math.cos(t)),mul(cross(u,q),Math.sin(t))),mul(u,dot(u,q)*(1-Math.cos(t)))))}
const A=p(0,2),D=p(0,0),C=p(1,0),B=p(3,0);const target={A:[0,2,0],D:[0,0,0],C:[1,0,0],B:[1,-1,Math.sqrt(3)]};const faces={g:['A','D','C'],r:['A','C','B'],y:['D','C','B'],b:['A','D','B']};const colors={g:[.40,.74,.57],r:[1,.48,.45],y:[1,.76,.36],b:[.44,.67,.97]};
const pieces=[];function piece(color,pts,parent=-1,edge=null){pieces.push({color,pts,parent,edge,angle:0});return pieces.length-1}
piece('g',[D,C,A]);piece('r',[A,C,B,p(1.5,1),p(1,1),p(1,4/3)],0,[A,C]);piece('y',[D,p(.5,-1),p(1,-1),C],0,[D,C]);piece('b',[D,p(0,-1),p(.5,-1)],2,[D,p(.5,-1)]);piece('b',[D,p(-1,0),p(-1,.5),p(-2/3,1),p(0,1)],0,[D,p(0,1)]);piece('r',[p(-1,.5),p(-1,1),p(-2/3,1)],4,[p(-1,.5),p(-2/3,1)]);piece('b',[A,p(1,4/3),p(1,2)],1,[A,p(1,4/3)]);piece('b',[B,p(2.5,1),p(1.5,1)],1,[B,p(1.5,1)]);piece('y',[B,p(3,1),p(2.5,1)],7,[B,p(2.5,1)]);
function transform(i,v,t){let o=pieces[i];if(o.parent<0)return v;return transform(o.parent,rot(v,...o.edge,o.angle*t),t)}
function score(v,tri){let [a,b,c]=tri,u=sub(b,a),w=sub(c,a),q=sub(v,a),n=unit(cross(u,w)),den=dot(u,u)*dot(w,w)-dot(u,w)**2,s=(dot(q,u)*dot(w,w)-dot(q,w)*dot(u,w))/den,t=(dot(q,w)*dot(u,u)-dot(q,u)*dot(u,w))/den;return Math.abs(dot(q,n))*10+Math.max(0,-s)+Math.max(0,-t)+Math.max(0,s+t-1)}
for(let i=1;i<pieces.length;i++){let o=pieces[i],tri=faces[o.color].map(k=>target[k]),best=Infinity,ang=0;for(let j=0;j<=1440;j++){o.angle=-Math.PI+j*Math.PI/720;let s=o.pts.reduce((z,v)=>z+score(transform(i,v,1),tri),0);if(s<best){best=s;ang=o.angle}}o.angle=ang;}
const vs='attribute vec3 a;attribute vec3 c;varying vec3 v;void main(){gl_Position=vec4(a,1.);v=c;}';const fs='precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.);}';function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}if(gl){let prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);let buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);for(let [name,offset] of [['a',0],['c',12]]){let l=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,3,gl.FLOAT,false,24,offset)}}
let t=0,goal=0,yaw=-.25,pitch=.35,zoom=1,drag=null;const labels={};for(let k of ['A','B','C','D']){let el=document.createElement('div');el.className='dot';el.innerHTML='<b>'+k+'</b>';document.querySelector('#labels').append(el);labels[k]=el}function project(v){let q=sub(v,[1,.5,0]);q=rot(q,[0,0,0],[0,0,1],yaw);q=rot(q,[0,0,0],[1,0,0],pitch);let s=zoom*1.75/4.2*Math.min(1,canvas.height/canvas.width);return [q[0]*s,-q[1]*s*canvas.width/canvas.height,q[2]*.15]}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,d=Math.min(devicePixelRatio,2);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}if(!canvas.width||!canvas.height)return;if(gl){gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.93,.94,.96,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);let data=[];function vertex(v,c){data.push(...project(v),...c)}function send(mode){gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);gl.drawArrays(mode,0,data.length/6);data=[]}let f=t*t*(3-2*t);for(let i=0;i<pieces.length;i++){let o=pieces[i],v=o.pts.map(q=>transform(i,q,f));for(let j=1;j<v.length-1;j++){vertex(v[0],colors[o.color]);vertex(v[j],colors[o.color]);vertex(v[j+1],colors[o.color])}}send(gl.TRIANGLES);for(let i=0;i<pieces.length;i++){let o=pieces[i],v=o.pts.map(q=>transform(i,q,f));for(let j=0;j<v.length;j++){vertex(v[j],[.19,.23,.27]);vertex(v[(j+1)%v.length],[.19,.23,.27])}}send(gl.LINES);}else if(ctx){ctx.fillStyle='#edf0f3';ctx.fillRect(0,0,canvas.width,canvas.height);let f=t*t*(3-2*t);let polys=pieces.map((o,i)=>({o,v:o.pts.map(q=>project(transform(i,q,f)))}));polys.sort((a,b)=>b.v.reduce((s,q)=>s+q[2],0)/b.v.length-a.v.reduce((s,q)=>s+q[2],0)/a.v.length);for(let {o,v} of polys){ctx.beginPath();v.forEach((q,i)=>{let x=(q[0]+1)*canvas.width/2,y=(1-q[1])*canvas.height/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgb('+colors[o.color].map(x=>Math.round(x*255)).join(',')+')';ctx.fill();ctx.strokeStyle='#303840';ctx.lineWidth=2;ctx.stroke();}}else{return;}document.querySelector('#fallback').style.display='none';let f=t*t*(3-2*t);for(let [k,v] of Object.entries({A,D,C,B})){let q=project(k==='B'?transform(1,v,f):v);labels[k].style.left=(q[0]+1)*50+'%';labels[k].style.top=(1-q[1])*50+'%'}msg.textContent=t>.995?'四面体ができた！（ドラッグで回せます）':t<.005?'ピンクの点線で折ると…':' ';msg.style.color=t>.995?'#d83b65':'#414957';if(!scrubbing)range.value=Math.round(t*1000);toggle.textContent=goal>.5?'ひらく':'組み立て'}let scrubbing=false,last=0;function tick(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(Math.abs(goal-t)>.0001)t+=Math.sign(goal-t)*Math.min(Math.abs(goal-t),dt*.42);draw();requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);toggle.onclick=()=>goal=goal>.5?0:1;function seek(){t=goal=Number(range.value)/1000;draw()}range.addEventListener('input',seek);range.addEventListener('change',()=>{scrubbing=false;seek()});range.addEventListener('pointerdown',()=>{scrubbing=true;goal=t});window.addEventListener('pointerup',()=>{scrubbing=false});document.querySelector('#back').onclick=()=>{goal=Math.max(0,t-.15)};document.querySelector('#next').onclick=()=>{goal=Math.min(1,t+.15)};
const points=new Map();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function distance(){let a=[...points.values()];return a.length>=2?Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]):0}canvas.addEventListener('pointerdown',e=>{points.set(e.pointerId,[e.clientX,e.clientY]);try{canvas.setPointerCapture(e.pointerId)}catch(_){} });canvas.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;let old=points.get(e.pointerId),before=distance();points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size>=2){let after=distance();if(before>0)zoom=clamp(zoom*after/before,.35,5)}else{yaw+=(e.clientX-old[0])*.012;pitch+=(e.clientY-old[1])*.012}draw()});for(let event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>points.delete(e.pointerId));canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.002),.35,5);draw()},{passive:false});document.querySelector('#reset').onclick=()=>{yaw=-.25;pitch=.35;zoom=1;draw()};document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{document.querySelector('#hint').textContent='画面全体に表示中。Safariのツールバーはブラウザ側で管理されます。'}}catch(e){document.querySelector('#hint').textContent='画面全体に表示中（ブラウザの全画面APIは利用できません）'}};window.addEventListener('resize',draw);
