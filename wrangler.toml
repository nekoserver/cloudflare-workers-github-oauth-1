name = "cloudflare-workers-github-oauth-1"
main = "src/worker-entry.ts"
compatibility_date = "2024-11-17"
assets = { directory = "./public" }

# 本番で Cloudflare DNS 上のサブドメインを Workers Route として使う場合の例。
# GitHub OAuth/App 側の callback/setup/webhook/homepage URL も同じホストへ統一する。
# routes = [
#   { pattern = "1.cfw1.nekomaneki.work/*", zone_name = "nekomaneki.work" }
# ]

# 環境変数（本番環境ではwrangler secretを使用）
[vars]
ENVIRONMENT = "development"
# GITHUB_CLIENT_ID は wrangler secret で管理する（[vars] に平文で書かない）
AI_CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# 通知（GitHub Webhook通知・/pts等）の送信先スイッチ。"worker" にすると
# 外部Workerへの送信に切り替わる。未設定・それ以外の値は従来どおり "slack"
# NOTIFY_TARGET = "worker"

# 必要なシークレット（wrangler secret putで設定）:
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put JWT_SECRET
#   wrangler secret put RESEND_WEBHOOK_SECRET
#   wrangler secret put SLACK_SIGNING_SECRET
#   wrangler secret put SLACK_OAUTH_TOKEN
#   wrangler secret put SLACK_CLIENT_SECRET
#   wrangler secret put SLACK_CLIENT_ID
#   wrangler secret put SLACK_CHANNEL_ID
#   wrangler secret put GITHUB_TOKEN        # PR diff取得用（GitHub PAT）
#
# オプション（[vars] または secret で設定可能）:
#   SLACK_BOT_USER_ID  # 自App自身のBot User ID（U始まり）。app_mentionイベントで自App自身の
#                       # 発言だけを除外し、他Bot経由の正当なメンションは処理できるようにする。
#                       # 未設定時はbot_id付きイベントを一律除外する（安全側デフォルト）。
#                       # 確認方法: curl -X POST https://slack.com/api/auth.test \
#                       #   -H "Authorization: Bearer $SLACK_OAUTH_TOKEN" のuser_idフィールド
#   GH_ATTACH_UPLOAD_TOKEN  # /gh-attach（gh issue create --attachのWASM移植）が
#     使うアップロード専用のGitHub PAT（classic、repo スコープ必須）。
#     uploads.github.com/user-attachments/assets はGitHub Appのトークン（ghu_）
#     では動作しない（実際に404が再現し検証済み。CLAUDE.md下部SPECファイル参照）ため、
#     このアプリのGitHub App由来のOAuthトークンとは別に、classic PATを用意する必要がある。
#     未設定の場合、/gh-attachのアップロードはエラーになる（リポジトリ情報取得・
#     Issue作成自体はユーザーのGitHub Appトークンのままで動作する）。
#   DYNAMICNEKO_PING_SECRET  # dynamicneko側 GET /api/ping のAuthorizationヘッダに使う
#                             # 共有シークレット。dynamicneko側のPING_SECRETと同じ値を設定する
#   KIMI_CODE_EXTERNAL_SECRET  # dynamicnekoのNew SnippetウィジェットがPOST
#                               # /api/kimi-code/generate-externalを呼ぶ際のBearer認証シークレット。
#                               # dynamicneko側も同じ変数名(KIMI_CODE_EXTERNAL_SECRET)・同じ値で設定する
#   CURSOR_API_KEY  # /cursor-agent が使うCursor Background Agent APIのAPIキー
#     未設定の場合、/cursor-agentからの起動は実行前に拒否される(Cursor APIへは
#     リクエストしない)。secretで管理し、[vars]には平文で書かないこと。
#     設定手順: wrangler secret put CURSOR_API_KEY
#   GOOGLE_CSE_API_KEY  # /neko vlink が使うGoogle Custom Search JSON APIのAPIキー
#   GOOGLE_CSE_CX       # /neko vlink が使うGoogle Programmable Search Engineの検索エンジンID(cx)
#     両方セットで設定する（片方のみの場合は/neko vlinkを無効化する）。secretで管理し、
#     [vars]には平文で書かないこと（CLAUDE.mdルール4）。
#     設定手順: wrangler secret put GOOGLE_CSE_API_KEY / wrangler secret put GOOGLE_CSE_CX
#   AI_MODEL       # PR要約・キーワード分類用 Workers AIモデル名（未設定時: @cf/google/gemma-4-26b-a4b-it）
#   AI_CHAT_MODEL  # AIチャットページ・Slack応答共通のモデル名（未設定時: @cf/meta/llama-3.3-70b-instruct-fp8-fast）
#     注意: gemma-4-26b-a4b-it はsystem messageが存在すると enable_thinking:false を無視して
#     thinking mode を強制的に有効化し、<think>タグではなく <|channel>...</channel|> 形式で
#     推論過程を応答に混入させる既知の制限がある（stripThinkTagsで除去できずSlack投稿が
#     失敗する原因になった）。デフォルトに戻す場合は要注意
#
# 通知先を外部Workerに切り替える場合（NOTIFY_TARGET="worker"）に必要:
#   wrangler secret put NOTIFY_WORKER_URL     # 送信先WorkerのエンドポイントURL
#   wrangler secret put NOTIFY_WORKER_SECRET  # Authorization: Bearer <secret> として送信（任意だが推奨）

# D1データベース設定（オプション）
# セッション管理を有効にするには以下の手順を実行してください:
#   1. wrangler d1 create workers-github-oauth
#   2. 出力された database_id を下記に設定して、コメントを外す
#   3. npm run db:migrate:remote でマイグレーションを実行
#
[[d1_databases]]
binding = "DB"
database_name = "workers-github-oauth"
database_id = "abbe590b-f7ff-4b98-b61c-17c8cb18c8cf"

# Workers AI バインディング（PR要約に使用）
[ai]
binding = "AI"

# dynamicneko（Cloudflare Dynamic Worker Loader使用）への直接呼び出し。/neko hellodwが
# 起動確認pingを送る。公開URLへの通常fetch()は*.workers.dev同士だとCloudflareに
# HTTP 404 error code: 1042で拒否される（実際に本番で発生し確認済み）ため、
# Service Binding経由にする。両WorkerがCloudflareの同一アカウントに存在する必要がある。
[[services]]
binding = "DYNAMICNEKO"
service = "dynamicneko"

# オブザーバビリティ設定
[observability]
enabled = true

# Analytics Engineバインディング（オプション）
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "github_oauth_metrics"

# /tree-view（dynamicneko）のサイドバーツリー用スナップショット（tree_view_snapshots）を
# 6時間ごとに再同期する（src/worker-entry.tsのscheduled()、installation_permissionsに
# 記録済みのnekoserver組織配下リポジトリが対象。新しいリポジトリへのGitHub App
# インストールも次回実行時に自動反映される）。
[triggers]
crons = ["0 */6 * * *"]
