name = "cloudflare-workers-github-oauth-1"
main = "src/worker-entry.ts"
compatibility_date = "2024-11-17"
assets = { directory = "./public" }

# 本番で Cloudflare DNS 上のサブドメインを Workers Route として使う場合の例。
# GitHub OAuth/App 側の callback/setup/webhook/homepage URL も同じホストへ統一する。
# routes = [
#   { pattern = "1.cfw1.nekomaneki.work/*", zone_name = "nekomaneki.work" }
# ]

# 環境変数（本番環境ではwrangler secretを使用）
# Dockerのビルドより前に、どのコミット・ビルドから作ったイメージかを
# containers/demo/build-info.json に書き出す(/cf-containersのヘルス表に出す)。
[build]
command = "sh scripts/write-container-build-info.sh"

[vars]
ENVIRONMENT = "development"
# アカウントIDは秘密情報ではないため[vars]に置く(/cf-containersのトークン設定・トンネル一覧で使用)
CLOUDFLARE_ACCOUNT_ID = "4eb48547c6f6a8194e6c3eb5e700463f"
# Redmine公開URL→Apache HMACゲートウェイURL。実環境に合わせて設定する。
# REDMINE_HMAC_TARGETS = '{"https://r9.nekomaneki.work":"https://r9.nekomaneki.work/redmine-hmac"}'
# GITHUB_CLIENT_ID は wrangler secret で管理する（[vars] に平文で書かない）
AI_CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# GitHubのnumeric IDは公開情報であり、デプロイ直後から管理者認可が機能するよう
# このWorkerの管理者を明示する。複数人の場合はカンマ区切りで追加する。
CF_DASHBOARD_ADMIN_GITHUB_IDS = "85157166"
# GitHub Webhook等の通知はcf-auth側で受信・記録する経路へ送る。
# デプロイ時にも送信先を維持し、未設定時のSlack送信へ戻らないよう明示する。
# /tsubuyaki・/pts・インタラクティブ投稿の返信は専用のSlack送信経路を使う。
NOTIFY_TARGET = "worker"
# 本体nekorootはmygwを維持。CFC用Tunnel・Secretとは分離する。
# src/utils/containerEndpoints.tsと同じ接続先を使用する。
NEKOROOT_HOSTNAME = "mygw.nekomaneki.work"
# askgkは独立側のCodex認証復旧まで、本体コンテナ(mygw)へ一時的に送る。
# 経路一覧はsrc/data/askgk-routes.json。ASKGK_ROUTESのJSON設定で上書きできる。
ASKGK_ROUTE_ID = "main"
# Independent Gadgets page; API token is the MUSE_GADGET_SDK_TOKEN secret.
MUSE_GADGET_RELAY_URL = "http://cf-demo-container:8766"

# 必要なシークレット（wrangler secret putで設定）:
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put REDMINE_HMAC_SECRET # Apacheゲートウェイと同じ専用シークレット
#   wrangler secret put JWT_SECRET
#   wrangler secret put RESEND_WEBHOOK_SECRET
#   wrangler secret put SLACK_SIGNING_SECRET
#   wrangler secret put SOT
#   wrangler secret put SLACK_CLIENT_SECRET
#   wrangler secret put SLACK_CLIENT_ID
#   wrangler secret put SLACK_CHANNEL_ID
#   wrangler secret put GITHUB_TOKEN        # PR diff取得用（GitHub PAT）
#
# オプション（[vars] または secret で設定可能）:
#   SLACK_BOT_USER_ID  # 自App自身のBot User ID（U始まり）。app_mentionイベントで自App自身の
#                       # 発言だけを除外し、他Bot経由の正当なメンションは処理できるようにする。
#                       # 未設定時はbot_id付きイベントを一律除外する（安全側デフォルト）。
#                       # 確認方法: curl -X POST https://slack.com/api/auth.test \
#                       #   -H "Authorization: Bearer $SOT" のuser_idフィールド
#   GH_ATTACH_UPLOAD_TOKEN  # /gh-attach（gh issue create --attachのWASM移植）が
#     使うアップロード専用のGitHub PAT（classic、repo スコープ必須）。
#     uploads.github.com/user-attachments/assets はGitHub Appのトークン（ghu_）
#     では動作しない（実際に404が再現し検証済み。CLAUDE.md下部SPECファイル参照）ため、
#     このアプリのGitHub App由来のOAuthトークンとは別に、classic PATを用意する必要がある。
#     未設定の場合、/gh-attachのアップロードはエラーになる（リポジトリ情報取得・
#     Issue作成自体はユーザーのGitHub Appトークンのままで動作する）。
#   DYNAMICNEKO_PING_SECRET  # dynamicneko側 GET /api/ping のAuthorizationヘッダに使う
#                             # 共有シークレット。dynamicneko側のPING_SECRETと同じ値を設定する
#   KIMI_CODE_EXTERNAL_SECRET  # dynamicnekoのNew SnippetウィジェットがPOST
#                               # /api/kimi-code/generate-externalを呼ぶ際のBearer認証シークレット。
#                               # dynamicneko側も同じ変数名(KIMI_CODE_EXTERNAL_SECRET)・同じ値で設定する
#   JEV_PLAYGROUND_EXTERNAL_SECRET  # dynamicnekoのJev Playground専用Bearer認証シークレット。
#     JEV_API_KEYの代理利用経路を他のexternal APIから分離するため、AICHAT_EXTERNAL_SECRETとは
#     必ず異なる値をsecretで設定し、dynamicneko側にも同じ値を設定する。未設定時は移行互換性のため
#     AICHAT_EXTERNAL_SECRETを使用するが、専用secretを両Workerへ設定して切り替えることを推奨する。
#   CURSOR_API_KEY  # /cursor-agent が使うCursor Background Agent APIのAPIキー
#     未設定の場合、/cursor-agentからの起動は実行前に拒否される(Cursor APIへは
#     リクエストしない)。secretで管理し、[vars]には平文で書かないこと。
#     設定手順: wrangler secret put CURSOR_API_KEY
#   CLOUDFLARE_API_KEY  # /cf-dashboardでアカウント内の全D1を列挙する場合のみ必要
#                       # API TokenまたはGlobal API Key（secretで管理）
#   CLOUDFLARE_ACCOUNT_ID  # 上記API利用時にD1を列挙するアカウントID
#   CLOUDFLARE_API_EMAIL  # Global API Key利用時のみ必要（API Tokenでは不要）
#   CF_DASHBOARD_ADMIN_GITHUB_IDS  # /cf-dashboardを許可するGitHub numeric ID（カンマ区切り）
#     GitHubプロフィールAPIのid値を[vars]に設定する（公開情報なのでsecretでなくてよい）。
#     未設定・不正な値の場合は全員を拒否する。
#   R9_HMAC_SECRET  # /r9-status が https://r9.nekomaneki.work への署名付きGETに使う
#     HMACシークレット（deploy/redmine/のHMACゲートウェイと同じ方式）。
#     r9.nekomaneki.work側の検証プログラムにも同じ値を設定する。
#     設定手順: wrangler secret put R9_HMAC_SECRET
#   GOOGLE_CSE_API_KEY  # /neko vlink が使うGoogle Custom Search JSON APIのAPIキー
#   GOOGLE_CSE_CX       # /neko vlink が使うGoogle Programmable Search Engineの検索エンジンID(cx)
#     両方セットで設定する（片方のみの場合は/neko vlinkを無効化する）。secretで管理し、
#     [vars]には平文で書かないこと（CLAUDE.mdルール4）。
#     設定手順: wrangler secret put GOOGLE_CSE_API_KEY / wrangler secret put GOOGLE_CSE_CX
#   AI_MODEL       # PR要約・キーワード分類用 Workers AIモデル名（未設定時: @cf/google/gemma-4-26b-a4b-it）
#   AI_CHAT_MODEL  # AIチャットページ・Slack応答共通のモデル名（未設定時: @cf/meta/llama-3.3-70b-instruct-fp8-fast）
#     注意: gemma-4-26b-a4b-it はsystem messageが存在すると enable_thinking:false を無視して
#     thinking mode を強制的に有効化し、<think>タグではなく <|channel>...</channel|> 形式で
#     推論過程を応答に混入させる既知の制限がある（stripThinkTagsで除去できずSlack投稿が
#     失敗する原因になった）。デフォルトに戻す場合は要注意
#
# 通知先を外部Workerに切り替える場合（NOTIFY_TARGET="worker"）に必要:
#   wrangler secret put NOTIFY_WORKER_URL     # 送信先WorkerのエンドポイントURL
#   wrangler secret put NOTIFY_WORKER_SECRET  # Authorization: Bearer <secret> として送信（任意だが推奨）
#
# /repo-onboarding-checkの④⑤（cf-auth /wspace・dynamicneko tree-viewの確認）に必要
# （CF-Worker + HMAC方式、CLAUDE.mdルール38）:
#   wrangler secret put CF_AUTH_WORKER_HMAC_SECRET       # cf-auth側のCF_WORKER_SECRET_MAINと同じ値
#   wrangler secret put DYNAMICNEKO_WORKER_HMAC_SECRET   # dynamicneko側のCF_WORKER_SECRET_MAINと同じ値

# D1データベース設定（オプション）
# セッション管理を有効にするには以下の手順を実行してください:
#   1. wrangler d1 create workers-github-oauth
#   2. 出力された database_id を下記に設定して、コメントを外す
#   3. npm run db:migrate:remote でマイグレーションを実行
#
[[d1_databases]]
binding = "DB"
database_name = "workers-github-oauth"
database_id = "abbe590b-f7ff-4b98-b61c-17c8cb18c8cf"

# Museとの協議の記録(エージェントへの問い合わせ)。/muse-inquiriesのカンバンが読むだけで、書き込みはClaude Codeが
# 問い合わせのたびに行う。人の問答集(ai_chat_shares)とは別のデータベース(ユーザー指定)。スキーマはmigrations-agent-inquiries/。
[[d1_databases]]
binding = "INQUIRY_DB"
database_name = "agent-inquiries"
database_id = "ab65ff96-6333-4673-9ad4-4324be622184"

# Workers AI バインディング（PR要約に使用）
[ai]
binding = "AI"

# /cf-containers（Cloudflare Containersのデモ用管理ページ、管理者限定）が
# 起動・停止・再起動・プロキシの対象にするデモコンテナ。
# 注意（必ず理解してから使うこと）: Durable Objects・Containersはどちらも
# 使用量課金が発生する（DO: リクエスト数・実行時間・ストレージ、
# Containers: vCPU秒・メモリGiB秒・ディスクGB-月。起動中は継続的に課金
# されるため、使い終わったら/cf-containersから必ず停止すること）。
# sleepAfter(src/containers/demoContainer.ts)で一定時間後に自動停止する
# ようにしているが、起動したまま放置しないよう運用で注意する。
[[containers]]
class_name = "DemoContainer"
image = "./containers/demo/Dockerfile"
# Purpose-specific bundle: Docker is optional; keep the development tools currently used.
image_vars = { INSTALL_DOCKER = "false", INSTALL_VITEST = "true", INSTALL_TYPESCRIPT = "true", INSTALL_WRANGLER = "true" }
max_instances = 1
# standard-1(1/2 vCPU・4GiBメモリ・8GBディスク)。既定のlite(1/16 vCPU・
# 256MiB)ではtmux上でCLIを動かすには心細いため、実用と節約のバランスを
# とってstandardの中で最小のこの構成にしている。
instance_type = "standard-1"

# SSH(`wrangler containers ssh <INSTANCE_ID>` またはsshクライアント経由)で
# コンテナにログインするための公開鍵。wranglerのSSHサポートはデフォルトで
# 有効。ed25519のみ対応。秘密鍵はここに書かない(公開鍵のみ)。
[[containers.authorized_keys]]
name = "admin"
public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJM8/iV+DiD+cTQQgadOhHKkTUR+2ldz9ocGxC45sRbD"

[[durable_objects.bindings]]
name = "DEMO_CONTAINER"
class_name = "DemoContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DemoContainer"]

# AIチャットのジョブ(src/durable/aichatJob.ts)。送信後にタブを閉じたり別ウィンドウへ移ったりしても、
# 応答とその後のログ保存を最後まで行う(ユーザー指定、2026-11-07)。1回の質問ごとに1つのオブジェクトを
# 使い、完了から24時間でデータを消す。DOのリクエスト数・実行時間・ストレージの使用量課金が発生する。
[[durable_objects.bindings]]
name = "AICHAT_JOB"
class_name = "AichatJob"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AichatJob"]

# Independent server-side WASM tailnet node for /tailscale-wasm.
# No container image build is needed for this class.
[[durable_objects.bindings]]
name = "TAILSCALE_WASM"
class_name = "TailscaleWasm"

[[migrations]]
tag = "v3-tailscale-wasm"
new_sqlite_classes = ["TailscaleWasm"]

# dynamicneko（Cloudflare Dynamic Worker Loader使用）への直接呼び出し。/neko hellodwが
# 起動確認pingを送る。公開URLへの通常fetch()は*.workers.dev同士だとCloudflareに
# HTTP 404 error code: 1042で拒否される（実際に本番で発生し確認済み）ため、
# Service Binding経由にする。両WorkerがCloudflareの同一アカウントに存在する必要がある。
[[services]]
binding = "DYNAMICNEKO"
service = "dynamicneko"

# rust-worker-sqlx-d1への直接呼び出し。/neko askgkがtunnels.rbへのHMAC署名付き
# POST代行(/tunnel-signer/send)を呼ぶ。上と同じ理由でService Binding経由にする。
[[services]]
binding = "RUST_WORKER"
service = "rust-worker-sqlx-d1"

# cf-auth（dynamicneko/cf-authサブディレクトリ、別デプロイのWorker）への直接呼び出し。
# /wh-setting_github-to-slackページがcf-auth側の設定状況(secretの有無)を横比較表示する
# ために使う。上と同じ理由でService Binding経由にする。
[[services]]
binding = "CF_AUTH"
service = "cf-auth"

# muse-monitor(読み取り専用のMuseシステムモニタ、別デプロイのWorker)への呼び出し。
# /api/muse-monitor/:sectionがHMAC署名(MONITOR_HMAC_SECRET)付きで/api/hmac/*を呼ぶ。
# 上と同じ理由(1042)でService Binding経由にする。
[[services]]
binding = "MUSE_MONITOR"
service = "muse-monitor"

# オブザーバビリティ設定
[observability]
enabled = true

# Analytics Engineバインディング（オプション）
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "github_oauth_metrics"

# /tree-view（dynamicneko）のサイドバーツリー用スナップショット（tree_view_snapshots）を
# 6時間ごとに再同期する（src/worker-entry.tsのscheduled()、installation_permissionsに
# 記録済みのnekoserver組織配下リポジトリが対象。新しいリポジトリへのGitHub App
# インストールも次回実行時に自動反映される）。
[triggers]
crons = ["0 */6 * * *", "5 * * * *"]
