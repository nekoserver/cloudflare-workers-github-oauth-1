[package]
name = "sqlx-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres"] }
wasm-bindgen = "=0.2.127"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true

# sqlx-postgres は `.pgpass` 探索のために `home` クレートに依存しているが、
# `home` 0.5.12 は wasm32-unknown-unknown をサポートしておらずビルドできない。
# このクレートは接続を確立せずクエリ文字列の組み立てにしか sqlx を使わないため、
# 常に None を返すスタブに差し替える。詳細は vendor/home-stub/src/lib.rs 参照。
[patch.crates-io]
home = { path = "vendor/home-stub" }
