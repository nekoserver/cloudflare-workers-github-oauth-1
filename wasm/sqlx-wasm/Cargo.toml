[package]
name = "sqlx-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres"] }
wasm-bindgen = "0.2.127"

[profile.release]
opt-level = "z"
lto = true
