[package]
name = "rust-worker-sqlx-d1"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.5", features = ["d1"] }
sqlx-d1 = { version = "0.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
