<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>認証・Revoke フローチャート</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #57606a;
    --ok: #1a7f37;
    --ok-bg: #dafbe1;
    --ok-border: #4ac26b;
    --ng: #cf222e;
    --ng-bg: #ffebe9;
    --ng-border: #ff818266;
    --warn: #9a6700;
    --warn-bg: #fff8c5;
    --warn-border: #d4a72c;
    --blue: #0969da;
    --blue-bg: #ddf4ff;
    --blue-border: #54aeff66;
    --purple: #6639ba;
    --purple-bg: #fbefff;
    --purple-border: #c297ff;
    --neutral-bg: #f0f0f0;
    --neutral-border: #d0d7de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --ok: #3fb950;
      --ok-bg: #0f2d1a;
      --ok-border: #238636;
      --ng: #f85149;
      --ng-bg: #2d1117;
      --ng-border: #da3633;
      --warn: #d29922;
      --warn-bg: #2d2200;
      --warn-border: #9e6a03;
      --blue: #58a6ff;
      --blue-bg: #0c2d4e;
      --blue-border: #1f6feb;
      --purple: #bc8cff;
      --purple-bg: #1a0938;
      --purple-border: #6e40c9;
      --neutral-bg: #21262d;
      --neutral-border: #30363d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    min-height: 100vh;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-box {
    width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid;
  }
  .scroll-wrap {
    overflow: auto;
    padding: 20px;
  }
  svg {
    display: block;
    overflow: visible;
  }

  /* ノードスタイル */
  .node-start rect    { fill: var(--neutral-bg); stroke: var(--neutral-border); stroke-width: 1.5; rx: 20; }
  .node-check rect   { fill: var(--warn-bg);    stroke: var(--warn-border);   stroke-width: 1.5; }
  .node-action rect  { fill: var(--blue-bg);    stroke: var(--blue-border);   stroke-width: 1.5; }
  .node-ok rect      { fill: var(--ok-bg);      stroke: var(--ok-border);     stroke-width: 1.5; rx: 8; }
  .node-ng rect      { fill: var(--ng-bg);      stroke: var(--ng-border);     stroke-width: 1.5; rx: 8; }
  .node-warn rect    { fill: var(--purple-bg);  stroke: var(--purple-border); stroke-width: 1.5; rx: 8; }

  text { font-family: inherit; font-size: 11.5px; fill: var(--text); }
  .label-ok  { fill: var(--ok); font-weight: 600; }
  .label-ng  { fill: var(--ng); font-weight: 600; }
  .label-warn { fill: var(--warn); font-weight: 600; }
  .label-blue { fill: var(--blue); font-weight: 600; }
  .label-muted { fill: var(--muted); font-size: 10px; }

  .edge { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .edge-ok   { stroke: var(--ok); }
  .edge-ng   { stroke: var(--ng); }
  .edge-warn { stroke: var(--warn); }
  .edge-blue { stroke: var(--blue); }

  .edge-label {
    font-size: 10px;
    fill: var(--muted);
  }
  .edge-label-ok   { fill: var(--ok); font-weight: 600; }
  .edge-label-ng   { fill: var(--ng); font-weight: 600; }
</style>
</head>
<body>
<h1>認証・セッション revoke フローチャート</h1>
<div class="legend">
  <div class="legend-item"><div class="legend-box" style="background:var(--neutral-bg);border-color:var(--neutral-border)"></div>開始・分岐</div>
  <div class="legend-item"><div class="legend-box" style="background:var(--warn-bg);border-color:var(--warn-border)"></div>判定（Yes/No）</div>
  <div class="legend-item"><div class="legend-box" style="background:var(--blue-bg);border-color:var(--blue-border)"></div>処理・参照</div>
  <div class="legend-item"><div class="legend-box" style="background:var(--ok-bg);border-color:var(--ok-border)"></div>正常終端（通過）</div>
  <div class="legend-item"><div class="legend-box" style="background:var(--ng-bg);border-color:var(--ng-border)"></div>異常終端（401）</div>
  <div class="legend-item"><div class="legend-box" style="background:var(--purple-bg);border-color:var(--purple-border)"></div>副作用（通知・既定OFF/NOTIFY_TARGETでSlack⇄外部Worker切替）</div>
</div>
<p style="padding:6px 20px 0;font-size:11px;color:var(--muted)">
  通知まわりの詳細な変遷は
  <a href="https://github.com/nekoserver/cloudflare-workers-github-oauth-1/blob/main/SPEC.slack.latest.md" style="color:var(--blue)">SPEC.slack.latest.md</a>
  を参照(2026-07-05 f5e89e0でnotifyDispatch化、2026-07-10 276f13cでD1のnotification_settingsによるON/OFF・既定OFFに変更)。
</p>
<div class="scroll-wrap">
<svg id="chart" width="1200" height="3100" viewBox="0 0 1200 3100">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/>
  </marker>
  <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ok)"/>
  </marker>
  <marker id="arrow-ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ng)"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--blue)"/>
  </marker>
</defs>

<!-- ========== NODES ========== -->

<!-- [S] リクエスト受信 -->
<g transform="translate(450,30)">
  <rect x="0" y="0" width="300" height="44" rx="22" fill="var(--neutral-bg)" stroke="var(--neutral-border)" stroke-width="1.5"/>
  <text x="150" y="27" text-anchor="middle" font-weight="600">リクエスト受信</text>
</g>

<!-- [1] トークンあり？ -->
<g transform="translate(420,120)">
  <rect x="0" y="0" width="360" height="50" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="180" y="21" text-anchor="middle" font-weight="600">トークンがある？</text>
  <text x="180" y="38" text-anchor="middle" class="label-muted">Authorization: Bearer ヘッダー or Cookie auth_token</text>
</g>

<!-- [NG1] 401 No token -->
<g transform="translate(860,120)">
  <rect x="0" y="0" width="280" height="50" rx="8" fill="var(--ng-bg)" stroke="var(--ng-border)" stroke-width="1.5"/>
  <text x="140" y="20" text-anchor="middle" class="label-ng">401 Unauthorized</text>
  <text x="140" y="37" text-anchor="middle" class="label-muted">「認証が必要です」</text>
</g>

<!-- [2] JWTが有効か？ -->
<g transform="translate(390,220)">
  <rect x="0" y="0" width="420" height="50" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="210" y="21" text-anchor="middle" font-weight="600">JWT署名・期限が有効か？</text>
  <text x="210" y="38" text-anchor="middle" class="label-muted">JWT_SECRET で検証。期限切れ・改ざんは Invalid</text>
</g>

<!-- [WARN2] 通知: invalid JWT (既定OFF・NOTIFY_TARGET切替) -->
<g transform="translate(870,205)">
  <rect x="0" y="0" width="260" height="70" rx="8" fill="var(--purple-bg)" stroke="var(--purple-border)" stroke-width="1.5"/>
  <text x="130" y="16" text-anchor="middle" font-weight="600" fill="var(--purple)">通知（設定がONの場合のみ・既定OFF）</text>
  <text x="130" y="32" text-anchor="middle" class="label-muted">[セキュリティ警告] 無効なJWTトークンによる試行</text>
  <text x="130" y="47" text-anchor="middle" class="label-muted">NOTIFY_TARGET設定でSlack/外部Workerに切替可</text>
  <text x="130" y="61" text-anchor="middle" class="label-muted">fire-and-forget</text>
</g>

<!-- [NG2] 401 invalid JWT -->
<g transform="translate(870,300)">
  <rect x="0" y="0" width="260" height="50" rx="8" fill="var(--ng-bg)" stroke="var(--ng-border)" stroke-width="1.5"/>
  <text x="130" y="20" text-anchor="middle" class="label-ng">401 Unauthorized</text>
  <text x="130" y="37" text-anchor="middle" class="label-muted">「無効なトークンです」</text>
</g>

<!-- [3] ソース分岐 -->
<g transform="translate(395,320)">
  <rect x="0" y="0" width="410" height="50" fill="var(--neutral-bg)" stroke="var(--neutral-border)" stroke-width="1.5"/>
  <text x="205" y="21" text-anchor="middle" font-weight="600">トークンのソース</text>
  <text x="205" y="38" text-anchor="middle" class="label-muted">Cookie auth_token  または  Authorization: Bearer</text>
</g>

<!-- ============ COOKIE PATH ============ -->

<!-- [C1] D1参照 (cookie) -->
<g transform="translate(80,430)">
  <rect x="0" y="0" width="360" height="66" fill="var(--blue-bg)" stroke="var(--blue-border)" stroke-width="1.5"/>
  <text x="180" y="18" text-anchor="middle" font-weight="600" fill="var(--blue)">D1参照</text>
  <text x="180" y="34" text-anchor="middle" class="label-muted">user_sessions WHERE user_id = ?</text>
  <text x="180" y="50" text-anchor="middle" class="label-muted">取得: last_activity_at, revoked_at, idle_timeout_seconds</text>
</g>

<!-- [C2] revoke済み？ (cookie) -->
<g transform="translate(80,548)">
  <rect x="0" y="0" width="360" height="50" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="180" y="21" text-anchor="middle" font-weight="600">revoked_at が設定されている？</text>
  <text x="180" y="38" text-anchor="middle" class="label-muted">NULL でなければ強制revoke済み</text>
</g>

<!-- [WARN-C2] 通知: revoked cookie (既定OFF・NOTIFY_TARGET切替) -->
<g transform="translate(20,648)">
  <rect x="0" y="0" width="220" height="70" rx="8" fill="var(--purple-bg)" stroke="var(--purple-border)" stroke-width="1.5"/>
  <text x="110" y="16" text-anchor="middle" font-weight="600" fill="var(--purple)" font-size="10.5">通知（設定ONの場合のみ・既定OFF）</text>
  <text x="110" y="32" text-anchor="middle" class="label-muted">[セキュリティ警告]</text>
  <text x="110" y="46" text-anchor="middle" class="label-muted">revoke済みセッション試行</text>
  <text x="110" y="60" text-anchor="middle" class="label-muted">NOTIFY_TARGETでSlack/外部Worker</text>
</g>

<!-- [NG-C2] 401 revoked (cookie) -->
<g transform="translate(30,748)">
  <rect x="0" y="0" width="200" height="60" rx="8" fill="var(--ng-bg)" stroke="var(--ng-border)" stroke-width="1.5"/>
  <text x="100" y="20" text-anchor="middle" class="label-ng">401 Unauthorized</text>
  <text x="100" y="37" text-anchor="middle" class="label-muted">Cookie削除</text>
  <text x="100" y="52" text-anchor="middle" class="label-muted">「セッションが無効化されました」</text>
</g>

<!-- [C3] アイドルタイムアウト計算 -->
<g transform="translate(80,648)">
  <rect x="0" y="0" width="360" height="80" fill="var(--blue-bg)" stroke="var(--blue-border)" stroke-width="1.5"/>
  <text x="180" y="18" text-anchor="middle" font-weight="600" fill="var(--blue)">アイドルタイムアウト算出</text>
  <text x="180" y="34" text-anchor="middle" class="label-muted">優先度: 環境変数 SESSION_IDLE_TIMEOUT_SECONDS</text>
  <text x="180" y="50" text-anchor="middle" class="label-muted">→ D1 idle_timeout_seconds (設定ページで変更可)</text>
  <text x="180" y="66" text-anchor="middle" class="label-muted">→ session_duration → デフォルト30分</text>
</g>

<!-- [C4] last_activity チェック -->
<g transform="translate(80,782)">
  <rect x="0" y="0" width="360" height="66" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="180" y="21" text-anchor="middle" font-weight="600">最終アクティビティからの経過時間</text>
  <text x="180" y="38" text-anchor="middle" class="label-muted">Cookie last_activity または D1 last_activity_at</text>
  <text x="180" y="55" text-anchor="middle" class="label-muted">を参照。どちらもNULLならタイムアウト扱い</text>
</g>

<!-- [NG-C4] 401 idle timeout -->
<g transform="translate(30,908)">
  <rect x="0" y="0" width="200" height="60" rx="8" fill="var(--ng-bg)" stroke="var(--ng-border)" stroke-width="1.5"/>
  <text x="100" y="20" text-anchor="middle" class="label-ng">401 Unauthorized</text>
  <text x="100" y="37" text-anchor="middle" class="label-muted">Cookie削除</text>
  <text x="100" y="52" text-anchor="middle" class="label-muted">「セッションの有効期限が切れました」</text>
</g>

<!-- [C5] D1 last_activity_at 更新 (スロットリング) -->
<g transform="translate(80,908)">
  <rect x="0" y="0" width="360" height="60" fill="var(--blue-bg)" stroke="var(--blue-border)" stroke-width="1.5"/>
  <text x="180" y="18" text-anchor="middle" font-weight="600" fill="var(--blue)">last_activity を更新（fire-and-forget）</text>
  <text x="180" y="34" text-anchor="middle" class="label-muted">Cookie last_activity を Set-Cookie で更新</text>
  <text x="180" y="50" text-anchor="middle" class="label-muted">D1 last_activity_at は5分スロットリング</text>
</g>

<!-- [OK-cookie] 通過 -->
<g transform="translate(90,1020)">
  <rect x="0" y="0" width="340" height="50" rx="8" fill="var(--ok-bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="170" y="20" text-anchor="middle" class="label-ok">✓ 認証通過（Cookie）</text>
  <text x="170" y="38" text-anchor="middle" class="label-muted">c.set('user', payload) → next()</text>
</g>

<!-- ============ BEARER PATH ============ -->

<!-- [B1] D1参照 (bearer) -->
<g transform="translate(740,430)">
  <rect x="0" y="0" width="360" height="66" fill="var(--blue-bg)" stroke="var(--blue-border)" stroke-width="1.5"/>
  <text x="180" y="18" text-anchor="middle" font-weight="600" fill="var(--blue)">D1参照（DBが存在する場合）</text>
  <text x="180" y="34" text-anchor="middle" class="label-muted">user_sessions WHERE user_id = ?</text>
  <text x="180" y="50" text-anchor="middle" class="label-muted">取得: revoked_at</text>
</g>

<!-- [B2] revoke済み？ (bearer) -->
<g transform="translate(740,548)">
  <rect x="0" y="0" width="360" height="50" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="180" y="21" text-anchor="middle" font-weight="600">revoked_at が設定されている？</text>
  <text x="180" y="38" text-anchor="middle" class="label-muted">NULL でなければ強制revoke済み</text>
</g>

<!-- [WARN-B2] 通知: revoked bearer (既定OFF・NOTIFY_TARGET切替) -->
<g transform="translate(725,648)">
  <rect x="0" y="0" width="230" height="70" rx="8" fill="var(--purple-bg)" stroke="var(--purple-border)" stroke-width="1.5"/>
  <text x="115" y="16" text-anchor="middle" font-weight="600" fill="var(--purple)" font-size="10.5">通知（設定ONの場合のみ・既定OFF）</text>
  <text x="115" y="32" text-anchor="middle" class="label-muted">[セキュリティ警告]</text>
  <text x="115" y="46" text-anchor="middle" class="label-muted">revoke済みセッション試行</text>
  <text x="115" y="60" text-anchor="middle" class="label-muted">NOTIFY_TARGETでSlack/外部Worker</text>
</g>

<!-- [NG-B2] 401 revoked bearer -->
<g transform="translate(740,748)">
  <rect x="0" y="0" width="200" height="50" rx="8" fill="var(--ng-bg)" stroke="var(--ng-border)" stroke-width="1.5"/>
  <text x="100" y="20" text-anchor="middle" class="label-ng">401 Unauthorized</text>
  <text x="100" y="37" text-anchor="middle" class="label-muted">「セッションが無効化されました」</text>
</g>

<!-- Bearer: アイドルチェックなし -->
<g transform="translate(740,648)">
  <rect x="220" y="0" width="220" height="60" fill="var(--neutral-bg)" stroke="var(--neutral-border)" stroke-width="1.5"/>
  <text x="330" y="18" text-anchor="middle" font-weight="600">アイドルタイムアウト</text>
  <text x="330" y="34" text-anchor="middle" class="label-muted">チェックなし</text>
  <text x="330" y="50" text-anchor="middle" class="label-muted">（Bearer はステートレス）</text>
</g>

<!-- [OK-bearer] 通過 -->
<g transform="translate(760,748)">
  <rect x="220" y="0" width="200" height="50" rx="8" fill="var(--ok-bg)" stroke="var(--ok-border)" stroke-width="1.5"/>
  <text x="310" y="20" text-anchor="middle" class="label-ok">✓ 認証通過（Bearer）</text>
  <text x="310" y="38" text-anchor="middle" class="label-muted">c.set('user', payload) → next()</text>
</g>

<!-- ============ ADMIN REVOKE ============ -->

<g transform="translate(400,1140)">
  <rect x="0" y="0" width="400" height="30" rx="0" fill="none" stroke="none"/>
  <text x="200" y="20" text-anchor="middle" font-weight="700" font-size="13" fill="var(--muted)">── 管理操作: POST /api/admin/revoke-session ──</text>
</g>

<!-- [ADM-S] 管理者リクエスト -->
<g transform="translate(450,1190)">
  <rect x="0" y="0" width="300" height="44" rx="22" fill="var(--neutral-bg)" stroke="var(--neutral-border)" stroke-width="1.5"/>
  <text x="150" y="28" text-anchor="middle" font-weight="600">POST /api/admin/revoke-session</text>
</g>

<!-- [ADM-1] 認証必須 -->
<g transform="translate(420,1282)">
  <rect x="0" y="0" width="360" height="50" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="180" y="21" text-anchor="middle" font-weight="600">authMiddleware 通過（操作者のJWT検証）</text>
  <text x="180" y="38" text-anchor="middle" class="label-muted">操作者も同じ認証フローを通る</text>
</g>

<!-- [ADM-2] validateRevokeRequest -->
<g transform="translate(420,1382)">
  <rect x="0" y="0" width="360" height="50" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="180" y="21" text-anchor="middle" font-weight="600">入力バリデーション</text>
  <text x="180" y="38" text-anchor="middle" class="label-muted">validateRevokeRequest: userId が非空文字列か？</text>
</g>

<!-- [NG-ADM] 400 -->
<g transform="translate(870,1382)">
  <rect x="0" y="0" width="220" height="50" rx="8" fill="var(--ng-bg)" stroke="var(--ng-border)" stroke-width="1.5"/>
  <text x="110" y="20" text-anchor="middle" class="label-ng">400 Bad Request</text>
  <text x="110" y="37" text-anchor="middle" class="label-muted">「userId は必須です」</text>
</g>

<!-- [ADM-3] D1更新 -->
<g transform="translate(420,1482)">
  <rect x="0" y="0" width="360" height="66" fill="var(--blue-bg)" stroke="var(--blue-border)" stroke-width="1.5"/>
  <text x="180" y="18" text-anchor="middle" font-weight="600" fill="var(--blue)">D1更新</text>
  <text x="180" y="34" text-anchor="middle" class="label-muted">UPDATE user_sessions SET revoked_at = now</text>
  <text x="180" y="50" text-anchor="middle" class="label-muted">WHERE user_id = ? AND revoked_at IS NULL</text>
</g>

<!-- [ADM-4] 変更あった？ -->
<g transform="translate(420,1598)">
  <rect x="0" y="0" width="360" height="50" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1.5"/>
  <text x="180" y="21" text-anchor="middle" font-weight="600">変更行数 &gt; 0？</text>
  <text x="180" y="38" text-anchor="middle" class="label-muted">既にrevoke済み or ユーザー不在 → changes=0</text>
</g>

<!-- [NG-ADM4] 404 -->
<g transform="translate(870,1598)">
