<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tour de France 2026 — ルート図</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#e6edf3; font-family:'Segoe UI','Hiragino Sans',sans-serif; overflow:hidden; width:100vw; height:100vh; }
canvas { display:block; cursor:grab; }
#header {
  position:absolute; top:0; left:0; right:0;
  background:rgba(13,17,23,0.92); border-bottom:1px solid #30363d;
  padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  backdrop-filter:blur(4px); z-index:10;
}
#header h1 { font-size:15px; font-weight:700; color:#e3b341; white-space:nowrap; }
#header .sub { font-size:11px; color:#8b949e; }
#legend {
  position:absolute; top:56px; right:16px;
  background:rgba(22,27,34,0.92); border:1px solid #30363d;
  border-radius:8px; padding:12px 16px; font-size:11px; line-height:2;
  backdrop-filter:blur(4px); z-index:10;
}
#legend h3 { font-size:11px; color:#8b949e; margin-bottom:4px; font-weight:400; }
.leg-row { display:flex; align-items:center; gap:7px; }
.leg-line { width:22px; height:3px; border-radius:2px; flex-shrink:0; }
.leg-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
#tooltip {
  position:absolute; pointer-events:none; z-index:20;
  background:rgba(13,17,23,0.97); border:1px solid #e3b34166;
  border-radius:8px; padding:10px 14px; font-size:12px;
  display:none; max-width:260px; line-height:1.7;
}
#tooltip .tt-stage { font-weight:700; color:#e3b341; margin-bottom:2px; }
#tooltip .tt-route { color:#e6edf3; }
#tooltip .tt-detail { color:#8b949e; font-size:11px; margin-top:3px; }
#info {
  position:absolute; bottom:16px; left:16px;
  font-size:11px; color:#8b949e;
  background:rgba(22,27,34,0.88); border:1px solid #30363d;
  border-radius:6px; padding:7px 12px; backdrop-filter:blur(4px);
}
</style>
</head>
<body>
<div id="header">
  <h1>🚴 Tour de France 2026</h1>
  <span class="sub">7月4日〜26日 &nbsp;|&nbsp; 全21ステージ &nbsp;|&nbsp; 約3,333km &nbsp;|&nbsp; バルセロナ → パリ</span>
</div>
<canvas id="c"></canvas>
<div id="legend">
  <h3>ステージ種別</h3>
  <div class="leg-row"><div class="leg-line" style="background:#3fb950"></div><span>平坦（フラット）</span></div>
  <div class="leg-row"><div class="leg-line" style="background:#ffa657"></div><span>丘陵（ヒリー）</span></div>
  <div class="leg-row"><div class="leg-line" style="background:#ff7b72"></div><span>山岳（マウンテン）</span></div>
  <div class="leg-row"><div class="leg-line" style="background:#79c0ff"></div><span>タイムトライアル</span></div>
  <div style="margin-top:6px;border-top:1px solid #30363d;padding-top:6px;">
  <div class="leg-row"><div class="leg-dot" style="background:#ff7b72;box-shadow:0 0 5px #ff7b72"></div><span>グランデパール / ゴール都市</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#e6edf3"></div><span>中間通過都市</span></div>
  </div>
</div>
<div id="tooltip">
  <div class="tt-stage" id="tt-stage"></div>
  <div class="tt-route" id="tt-route"></div>
  <div class="tt-detail" id="tt-detail"></div>
</div>
<div id="info">ドラッグ: パン &nbsp;|&nbsp; ホイール: ズーム &nbsp;|&nbsp; ステージ線ホバー: 詳細</div>
<script>
var STAGES = [
  { n:1,  date:'7/4(土)',  type:'TTT',     from:'バルセロナ',           to:'バルセロナ',             km:19.7,
    s:[41.3851,2.1734], e:[41.3851,2.1734] },
  { n:2,  date:'7/5(日)',  type:'hilly',   from:'タラゴナ',             to:'バルセロナ',             km:169.2,
    s:[41.1189,1.2445], e:[41.3851,2.1734] },
  { n:3,  date:'7/6(月)', type:'mountain', from:'グラノリェルス',        to:'レ・サングル（仏）',      km:196.2,
    s:[41.6087,2.2873], e:[42.5619,2.0442] },
  { n:4,  date:'7/7(火)', type:'hilly',   from:'カルカソンヌ',          to:'フォワ',                 km:182.4,
    s:[43.2119,2.3536], e:[42.9639,1.6053] },
  { n:5,  date:'7/8(水)', type:'flat',    from:'ランヌメザン',           to:'ポー',                   km:158.3,
    s:[43.1261,0.3840], e:[43.2951,-0.3708] },
  { n:6,  date:'7/9(木)', type:'mountain', from:'ポー',                 to:'ガヴァルニー＝ジェドル', km:186.4,
    s:[43.2951,-0.3708], e:[42.7322,-0.0131] },
  { n:7,  date:'7/10(金)', type:'flat',   from:'アジェトモー',           to:'ボルドー',               km:175.0,
    s:[43.6597,-0.5890], e:[44.8378,-0.5792] },
  { n:8,  date:'7/11(土)', type:'flat',   from:'ペリグー',              to:'ベルジュラック',          km:180.4,
    s:[45.1844,0.7212], e:[44.8500,0.4833] },
  { n:9,  date:'7/12(日)', type:'hilly',  from:'マルモール',            to:'ユッセル',               km:185.5,
    s:[45.1667,1.5500], e:[45.5500,2.3167] },
  { n:10, date:'7/14(火)', type:'mountain', from:'オーリヤック',         to:'ル・リオラン',           km:166.6,
    s:[44.9281,2.4400], e:[45.1000,2.7500] },
  { n:11, date:'7/15(水)', type:'flat',   from:'ヴィシー',              to:'ヌヴェール',              km:161.3,
    s:[46.1278,3.4267], e:[46.9897,3.1578] },
  { n:12, date:'7/16(木)', type:'flat',   from:'マニークール',           to:'シャロン＝シュル＝ソーヌ', km:179.1,
    s:[46.8633,3.1639], e:[46.7806,4.8539] },
  { n:13, date:'7/17(金)', type:'hilly',  from:'ドール',                to:'ベルフォール',            km:205.8,
    s:[47.0919,5.4939], e:[47.6369,6.8628] },
  { n:14, date:'7/18(土)', type:'mountain', from:'ミュルーズ',           to:'マルクシュタイン・フェレラン', km:155.3,
    s:[47.7508,7.3359], e:[47.9000,7.0167] },
  { n:15, date:'7/19(日)', type:'mountain', from:'シャンパニョール',      to:'プラトー・ド・ソレゾン',  km:183.9,
    s:[46.7450,5.9058], e:[46.0833,6.4833] },
  { n:16, date:'7/21(火)', type:'ITT',    from:'エヴィアン＝レ＝バン',   to:'トノン＝レ＝バン',       km:26.1,
    s:[46.4003,6.5880], e:[46.3708,6.4789] },
  { n:17, date:'7/22(水)', type:'flat',   from:'シャンベリー',           to:'ヴォワロン',              km:174.7,
    s:[45.5646,5.9178], e:[45.3633,5.5908] },
  { n:18, date:'7/23(木)', type:'mountain', from:'ヴォワロン',           to:'オルシエール＝メルレット', km:185.2,
    s:[45.3633,5.5908], e:[44.6833,6.3167] },
  { n:19, date:'7/24(金)', type:'mountain', from:'ガップ',               to:'アルプ・デュエズ',        km:127.9,
    s:[44.5594,6.0797], e:[45.0900,6.0700] },
  { n:20, date:'7/25(土)', type:'mountain', from:'ル・ブール＝ドワザン',  to:'アルプ・デュエズ（逆走）', km:170.9,
    s:[45.0550,6.0197], e:[45.0900,6.0700] },
  { n:21, date:'7/26(日)', type:'flat',   from:'トワリー',               to:'パリ（シャンゼリゼ）',   km:133.0,
    s:[48.9614,1.8478], e:[48.8698,2.3078] },
];

var TYPE_COLOR = { flat:'#3fb950', hilly:'#ffa657', mountain:'#ff7b72', TTT:'#79c0ff', ITT:'#79c0ff' };
var TYPE_LABEL = { flat:'平坦', hilly:'丘陵', mountain:'山岳', TTT:'チームTT', ITT:'個人TT' };

// collect unique waypoints for labeling
var WAYPOINTS = {};
function addWP(lat, lon, name, isAnchor) {
  var key = lat.toFixed(3)+','+lon.toFixed(3);
  if (!WAYPOINTS[key]) WAYPOINTS[key] = { lat:lat, lon:lon, name:name, anchor:false };
  if (isAnchor) WAYPOINTS[key].anchor = true;
}
STAGES.forEach(function(st, i) {
  addWP(st.s[0], st.s[1], st.from, i===0);
  addWP(st.e[0], st.e[1], st.to,   i===STAGES.length-1 || st.type==='mountain');
});
// Mark Barcelona and Paris as anchors
addWP(41.3851, 2.1734, 'バルセロナ', true);
addWP(48.8698, 2.3078, 'パリ', true);

var LON_MIN = -2.0, LON_MAX = 8.5, LAT_MIN = 41.0, LAT_MAX = 50.5;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var tooltip = document.getElementById('tooltip');
var ttStage = document.getElementById('tt-stage');
var ttRoute = document.getElementById('tt-route');
var ttDetail = document.getElementById('tt-detail');

var W, H, scale, ox, oy;
var panX = 0, panY = 0, zoom = 1;
var dragging = false, dragStart, panStart;
var hoveredStage = null;
var HEADER_H = 44;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  var aspect = (LON_MAX - LON_MIN) / (LAT_MAX - LAT_MIN);
  var pad = 60;
  var drawH = H - HEADER_H;
  if ((W - pad*2) / aspect < drawH - pad*2) {
    scale = (W - pad*2) / aspect;
    ox = pad;
    oy = HEADER_H + (drawH - scale) / 2;
  } else {
    scale = drawH - pad*2;
    ox = (W - scale * aspect) / 2;
    oy = HEADER_H + pad;
  }
}

function toScreen(lat, lon) {
  var aspect = (LON_MAX - LON_MIN) / (LAT_MAX - LAT_MIN);
  return {
    x: ox + (lon - LON_MIN) / (LON_MAX - LON_MIN) * scale * aspect * zoom + panX,
    y: oy + (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * scale * zoom + panY
  };
}

// rough country outline points for France & Spain (simplified)
var FRANCE_OUTLINE = [
  [51.09,-2.0],[51.09,2.5],[50.95,1.86],[50.72,1.60],[50.12,1.85],[49.50,0.18],
  [48.84,-1.55],[48.02,-1.83],[47.60,-2.55],[47.29,-2.38],[46.90,-2.10],
  [45.78,-1.36],[45.22,-0.64],[43.47,-1.79],[43.39,-1.65],[43.36,0.70],
  [42.56,1.73],[42.44,3.17],[43.24,3.26],[43.57,4.19],[43.43,4.88],
  [43.55,5.40],[43.12,6.04],[43.47,7.42],[43.86,7.60],[44.24,7.26],
  [44.87,6.89],[45.10,6.76],[45.65,7.20],[45.93,7.17],[46.45,7.63],
  [46.41,8.80],[47.00,8.22],[47.61,7.60],[48.00,7.48],[48.97,8.20],
  [49.46,8.03],[49.98,6.36],[50.12,5.82],[50.42,4.85],[50.82,4.24],
  [51.09,2.50],[51.09,-2.0]
];
var SPAIN_OUTLINE = [
  [43.39,-1.79],[43.36,0.70],[42.56,1.73],[42.44,3.17],[40.45,0.78],
  [37.42,-1.65],[36.05,-5.35],[36.00,-5.61],[36.40,-6.05],[37.43,-7.51],
  [37.03,-8.85],[38.00,-8.85],[39.00,-9.39],[41.40,-8.90],[41.90,-8.70],
  [42.02,-7.00],[42.80,-6.78],[43.79,-7.62],[43.79,-5.00],[43.60,-4.00],
  [43.57,-3.00],[43.48,-2.00],[43.39,-1.79]
];

function drawOutline(pts, color) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.beginPath();
  var p0 = toScreen(pts[0][0], pts[0][1]);
  ctx.moveTo(p0.x, p0.y);
  for (var i=1;i<pts.length;i++) {
    var p = toScreen(pts[i][0], pts[i][1]);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

function ptNearSegment(mx, my, ax, ay, bx, by) {
  var dx=bx-ax, dy=by-ay;
  var len2 = dx*dx+dy*dy;
  if (len2===0) return Math.hypot(mx-ax,my-ay);
  var t = Math.max(0, Math.min(1, ((mx-ax)*dx+(my-ay)*dy)/len2));
  return Math.hypot(mx-(ax+t*dx), my-(ay+t*dy));
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);

  // map background
  drawOutline(SPAIN_OUTLINE,  '#161b22');
  drawOutline(FRANCE_OUTLINE, '#1c2128');

  // stages
  STAGES.forEach(function(st) {
    var sa = toScreen(st.s[0], st.s[1]);
    var sb = toScreen(st.e[0], st.e[1]);
    var color = TYPE_COLOR[st.type] || '#8b949e';
    var isHover = hoveredStage && hoveredStage.n === st.n;

    // glow on hover
    if (isHover) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 10;
      ctx.globalAlpha = 0.2;
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = isHover ? 4 : 2.5;
    ctx.globalAlpha = isHover ? 1 : 0.75;
    if (st.type==='TTT'||st.type==='ITT') ctx.setLineDash([6,4]);
    ctx.stroke();
    ctx.restore();

    // stage number badge at midpoint
    var mx = (sa.x+sb.x)/2, my = (sa.y+sb.y)/2;
    if (zoom > 0.9) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(mx, my, 8, 0, Math.PI*2);
      ctx.fillStyle = isHover ? color : '#21262d';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = isHover ? '#0d1117' : color;
      ctx.font = '700 8px "Segoe UI",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(st.n, mx, my);
      ctx.restore();
    }
  });

  // waypoints
  var wps = Object.values(WAYPOINTS);
  wps.forEach(function(wp) {
    var sc = toScreen(wp.lat, wp.lon);
    var isAnchor = wp.anchor;
    var r = isAnchor ? 6 : 3.5;
    var color = isAnchor ? '#ff7b72' : '#c9d1d9';
    var glow  = isAnchor ? '#ff7b7288' : 'transparent';

    if (isAnchor) {
      var g = ctx.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, r*3);
      g.addColorStop(0, glow); g.addColorStop(1, 'transparent');
      ctx.save();
      ctx.beginPath(); ctx.arc(sc.x, sc.y, r*3, 0, Math.PI*2);
      ctx.fillStyle = g; ctx.fill();
      ctx.restore();
    }

    ctx.beginPath(); ctx.arc(sc.x, sc.y, r, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.fill();

    if (isAnchor || zoom > 1.2) {
      ctx.save();
      ctx.font = (isAnchor?'700':'400') + ' ' + (isAnchor?12:10) + 'px "Segoe UI",sans-serif';
      ctx.fillStyle = isAnchor ? '#ff7b72' : '#8b949e';
      ctx.globalAlpha = 0.9;
      ctx.fillText(wp.name, sc.x + r + 4, sc.y + 4);
      ctx.restore();
    }
  });

  requestAnimationFrame(draw);
}

// hover detection
canvas.addEventListener('mousemove', function(e) {
  if (dragging) {
    panX = panStart.x + (e.clientX - dragStart.x);
    panY = panStart.y + (e.clientY - dragStart.y);
    return;
  }
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  hoveredStage = null;

  for (var i=0;i<STAGES.length;i++) {
    var st = STAGES[i];
    var sa = toScreen(st.s[0], st.s[1]);
    var sb = toScreen(st.e[0], st.e[1]);
    var d = ptNearSegment(mx, my, sa.x, sa.y, sb.x, sb.y);
    if (d < 10) { hoveredStage = st; break; }
  }

  if (hoveredStage) {
    canvas.style.cursor = 'pointer';
    var st = hoveredStage;
    ttStage.textContent = 'ステージ ' + st.n + '  ' + st.date;
    ttRoute.textContent = st.from + '  →  ' + st.to;
    ttDetail.textContent = st.km + ' km  |  ' + TYPE_LABEL[st.type];
    tooltip.style.display = 'block';
    var tx = e.clientX + 16, ty = e.clientY - 10;
    if (tx + 260 > W) tx = e.clientX - 270;
    tooltip.style.left = tx + 'px';
    tooltip.style.top  = ty + 'px';
  } else {
    canvas.style.cursor = 'grab';
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mousedown', function(e) {
  dragging=true; dragStart={x:e.clientX,y:e.clientY}; panStart={x:panX,y:panY};
  canvas.style.cursor='grabbing'; tooltip.style.display='none';
});
window.addEventListener('mouseup', function() { dragging=false; canvas.style.cursor='grab'; });
canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  var f = e.deltaY < 0 ? 1.12 : 0.89;
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX-rect.left, my = e.clientY-rect.top;
  panX = mx+(panX-mx)*f; panY = my+(panY-my)*f;
  zoom = Math.max(0.4, Math.min(zoom*f, 10));
}, {passive:false});
window.addEventListener('resize', function() { resize(); });

resize();
draw();
</script>
</body>
</html>
