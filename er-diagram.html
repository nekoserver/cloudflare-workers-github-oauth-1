<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ER Diagram — cloudflare-workers-github-oauth-1</title>
<style>
  :root {
    --bg: #f0f2f5;
    --canvas-bg: #fff;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #656d76;
    --accent: #0969da;
    --accent-light: #ddf4ff;
    --table-bg: #fff;
    --table-header-bg: #f6f8fa;
    --pk-color: #cf222e;
    --fk-color: #0969da;
    --uk-color: #9a6700;
    --idx-color: #656d76;
    --line-color: #8b949e;
    --shadow: rgba(0,0,0,0.08);
    --toolbar-bg: #fff;
    --dropdown-bg: #fff;
    --dropdown-hover: #f6f8fa;
    --group-auth: #ddf4ff;
    --group-commit: #dafbe1;
    --group-ai: #fff8c5;
    --group-email: #ffebe9;
    --group-config: #f5f0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --canvas-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-light: #1c3a5c;
      --table-bg: #1c2333;
      --table-header-bg: #21262d;
      --pk-color: #f85149;
      --fk-color: #58a6ff;
      --uk-color: #d29922;
      --idx-color: #8b949e;
      --line-color: #484f58;
      --shadow: rgba(0,0,0,0.3);
      --toolbar-bg: #21262d;
      --dropdown-bg: #21262d;
      --dropdown-hover: #30363d;
      --group-auth: rgba(56,139,253,0.08);
      --group-commit: rgba(63,185,80,0.08);
      --group-ai: rgba(210,153,34,0.08);
      --group-email: rgba(248,81,73,0.08);
      --group-config: rgba(163,113,247,0.08);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 48px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 100;
    box-shadow: 0 1px 3px var(--shadow);
  }
  #toolbar h1 {
    font-size: 14px; font-weight: 600;
    white-space: nowrap;
  }
  #toolbar .spacer { flex: 1; }
  #toolbar button, #toolbar .dropdown-wrapper button {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--toolbar-bg);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  #toolbar button:hover { background: var(--accent-light); }
  #toolbar .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #toolbar .btn-primary:hover { opacity: 0.9; }

  #toolbar .view-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  #toolbar .view-toggle button {
    border: none;
    border-radius: 0;
    padding: 6px 12px;
    background: var(--toolbar-bg);
  }
  #toolbar .view-toggle button + button {
    border-left: 1px solid var(--border);
  }
  #toolbar .view-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  #toolbar .view-toggle button.active:hover {
    background: var(--accent);
    opacity: 0.9;
  }

  .dropdown-wrapper {
    position: relative;
    display: inline-block;
  }
  .dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    background: var(--dropdown-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 12px var(--shadow);
    min-width: 180px;
    z-index: 200;
    overflow: hidden;
  }
  .dropdown-menu.show { display: block; }
  .dropdown-menu button {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    text-align: left;
    padding: 8px 14px;
    border: none;
    border-radius: 0;
    font-size: 13px;
  }
  .dropdown-menu button:hover { background: var(--dropdown-hover); }
  .menu-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dropdown-menu .separator {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  #canvas-wrapper {
    position: fixed;
    top: 48px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: var(--canvas-bg);
  }
  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 3200px;
    height: 2400px;
    transform-origin: 0 0;
    will-change: transform;
  }
  #canvas.animating {
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #svg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  #svg-layer line {
    stroke: var(--line-color);
    stroke-width: 1.5;
  }
  #svg-layer .fk-label {
    font-size: 10px;
    fill: var(--text-muted);
  }

  .er-table {
    position: absolute;
    background: var(--table-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 2px 6px var(--shadow);
    min-width: 200px;
    z-index: 10;
    cursor: move;
    user-select: none;
    touch-action: none;
    transition: box-shadow 0.15s;
  }
  .er-table:hover {
    box-shadow: 0 4px 12px var(--shadow);
  }
  .er-table.dragging {
    box-shadow: 0 8px 24px var(--shadow);
    z-index: 50;
    opacity: 0.92;
  }
  .er-table-header {
    padding: 8px 12px;
    font-weight: 700;
    font-size: 13px;
    background: var(--table-header-bg);
    border-bottom: 1px solid var(--border);
    border-left: 4px solid var(--line-color);
    border-radius: 8px 8px 0 0;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .er-table-header:hover { filter: brightness(0.93); }
  .er-table-header .group-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .er-table.group-auth   > .er-table-header { background: var(--group-auth);   border-left-color: #388bfd; }
  .er-table.group-commit > .er-table-header { background: var(--group-commit); border-left-color: #3fb950; }
  .er-table.group-ai     > .er-table-header { background: var(--group-ai);     border-left-color: #d29922; }
  .er-table.group-email  > .er-table-header { background: var(--group-email);  border-left-color: #f85149; }
  .er-table.group-config > .er-table-header { background: var(--group-config); border-left-color: #a371f7; }
  .er-table-body {
    padding: 6px 0;
    font-size: 12px;
  }
  .er-col {
    padding: 2px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.5;
  }
  .er-col .col-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .er-col .pk { background: #ffebe9; color: var(--pk-color); }
  .er-col .fk { background: #ddf4ff; color: var(--fk-color); }
  .er-col .uk { background: #fff8c5; color: var(--uk-color); }
  .er-col .idx { background: #f0f0f0; color: var(--idx-color); }
  .er-col .col-name { font-weight: 500; }
  .er-col .col-type { color: var(--text-muted); margin-left: auto; }

  .legend {
    position: fixed;
    bottom: 16px;
    left: 16px;
    background: var(--toolbar-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 11px;
    z-index: 100;
    box-shadow: 0 2px 6px var(--shadow);
    min-width: 200px;
  }
  .legend-section-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 6px 2px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    background: transparent;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-size: 11px;
  }
  .legend-row:hover {
    background: var(--accent-light);
    border-color: var(--border);
  }
  .legend-row.active {
    background: var(--accent-light);
    border-color: var(--accent);
    font-weight: 600;
  }
  .legend-row.static {
    cursor: default;
  }
  .legend-row.static:hover {
    background: transparent;
    border-color: transparent;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-badges {
    display: flex;
    gap: 10px;
    padding: 4px 8px;
    flex-wrap: wrap;
  }
  .legend hr {
    margin: 6px 2px;
    border: 0;
    border-top: 1px solid var(--border);
  }

  .zoom-info {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: var(--toolbar-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    z-index: 100;
    box-shadow: 0 2px 6px var(--shadow);
    color: var(--text-muted);
  }

  /* Position Export/Import Modals */
  .pos-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .pos-modal-overlay.show { display: flex; }
  .pos-modal {
    background: var(--toolbar-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    width: 92%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pos-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
  }
  .pos-modal-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .pos-modal-close {
    border: none;
    background: none;
    font-size: 18px;
    cursor: pointer;
    color: var(--text-muted);
    line-height: 1;
    padding: 0 4px;
  }
  .pos-modal-close:hover { color: var(--text); background: none; }
  .pos-modal-body { padding: 16px 18px; }
  .pos-modal-textarea {
    width: 100%;
    height: 280px;
    font-family: monospace;
    font-size: 12px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--canvas-bg);
    color: var(--text);
    resize: vertical;
    outline: none;
    box-sizing: border-box;
  }
  .pos-modal-textarea:focus { border-color: var(--accent); }
  .pos-modal-textarea.error { border-color: #f85149; }
  .pos-modal-feedback {
    margin-top: 8px;
    font-size: 12px;
    min-height: 18px;
    color: var(--text-muted);
  }
  .pos-modal-feedback.error { color: #f85149; }
  .pos-modal-feedback.warn { color: #d29922; }
  .pos-modal-feedback.ok { color: #3fb950; }
  .pos-modal-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px 14px;
    border-top: 1px solid var(--border);
    justify-content: flex-end;
  }
  .pos-modal-footer button {
    font-size: 13px;
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--toolbar-bg);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .pos-modal-footer button:hover { background: var(--accent-light); }
  .pos-modal-footer .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .pos-modal-footer .btn-primary:hover { opacity: 0.9; background: var(--accent); }

  @media (prefers-color-scheme: dark) {
    .er-col .pk { background: rgba(248,81,73,0.15); }
    .er-col .fk { background: rgba(88,166,255,0.15); }
    .er-col .uk { background: rgba(210,153,34,0.15); }
    .er-col .idx { background: rgba(139,148,158,0.12); }
  }
  #er-group-legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 200;
    cursor: pointer; user-select: none;
  }
  .er-legend-box {
    background: var(--toolbar-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); min-width: 160px;
    font-size: 12px; color: var(--text);
  }
  .er-legend-header {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; gap: 8px; cursor: pointer;
  }
  .er-legend-content { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .er-legend-row { display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 4px; padding: 1px 2px; }
  .er-legend-row:hover { background: rgba(128,128,128,0.12); }
  .er-legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .er-legend-name { flex: 1; font-size: 11px; }
  .er-legend-code { font-size: 10px; font-family: monospace; color: var(--text-muted); }
  .td-modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 600;
    align-items: center; justify-content: center;
  }
  .td-modal-overlay.show { display: flex; }
  .td-modal {
    background: var(--toolbar-bg); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    width: 96%; max-width: 900px; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .td-modal-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
    gap: 12px; flex-shrink: 0;
  }
  .td-modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .td-modal-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .td-modal-close {
    border: none; background: none; font-size: 20px;
    cursor: pointer; color: var(--text-muted); line-height: 1;
    padding: 0 4px; flex-shrink: 0;
  }
  .td-modal-close:hover { color: var(--text); }
  .td-modal-body { padding: 12px 16px; overflow-y: auto; flex: 1; }
  .td-modal-note { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .td-modal-empty { font-size: 13px; color: var(--text-muted); padding: 20px 0; text-align: center; }
  .td-preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .td-preview-table th {
    background: var(--table-header-bg); border: 1px solid var(--border);
    padding: 5px 8px; text-align: left; font-weight: 600; white-space: nowrap;
    position: sticky; top: 0; z-index: 1;
  }
  .td-preview-table td {
    border: 1px solid var(--border); padding: 4px 8px;
    font-family: monospace; font-size: 11px;
    max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .td-preview-table tr:nth-child(even) td { background: rgba(128,128,128,0.04); }
  .td-badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 3px; margin-left: 3px; vertical-align: middle; }
  .td-badge.pk { background: #ffebe9; color: #cf222e; }
  .td-badge.fk { background: #ddf4ff; color: #0969da; }
  .td-badge.uk { background: #fff8c5; color: #9a6700; }
  .td-badge.idx { background: #f0f0f0; color: #656d76; }
  @media (prefers-color-scheme: dark) {
    .td-badge.pk { background: rgba(248,81,73,0.15); color: #f85149; }
    .td-badge.fk { background: rgba(88,166,255,0.15); color: #58a6ff; }
    .td-badge.uk { background: rgba(210,153,34,0.15); color: #d29922; }
    .td-badge.idx { background: rgba(139,148,158,0.15); color: #8b949e; }
  }
</style>
</head>
<body>
<div id="toolbar">
  <h1>ER Diagram</h1>
  <span style="font-size:12px;color:var(--text-muted)">cloudflare-workers-github-oauth-1</span>
  <span class="spacer"></span>
  <div class="dropdown-wrapper">
    <button onclick="toggleGroupMenu(event)">Filter Group ▾</button>
    <div id="group-menu" class="dropdown-menu">
      <button onclick="filterGroup('all')">すべて</button>
      <div class="separator"></div>
      <button onclick="filterGroup('auth')"><span class="menu-dot" style="background:#388bfd"></span>Auth / Session</button>
      <button onclick="filterGroup('commit')"><span class="menu-dot" style="background:#3fb950"></span>Commit / Cache</button>
      <button onclick="filterGroup('ai')"><span class="menu-dot" style="background:#d29922"></span>AI Summary / Chat</button>
      <button onclick="filterGroup('email')"><span class="menu-dot" style="background:#f85149"></span>Email / Resend</button>
      <button onclick="filterGroup('config')"><span class="menu-dot" style="background:#a371f7"></span>Config / Settings</button>
    </div>
  </div>
  <button onclick="resetPositions()">Reset Layout</button>
  <div class="view-toggle" role="group" aria-label="View mode">
    <button id="view-mode-focus" onclick="setViewMode('focus')" title="画面左上にフォーカス（等倍表示）">フォーカス</button>
    <button id="view-mode-overview" onclick="setViewMode('overview')" title="画面全体を俯瞰（全エンティティを画面に収める）">俯瞰</button>
  </div>
  <button onclick="openExportModal()">座標を出力</button>
  <button onclick="openImportModal()">座標入力</button>
  <div class="dropdown-wrapper">
    <button class="btn-primary" onclick="toggleSaveMenu(event)">Save Positions</button>
    <div id="save-menu" class="dropdown-menu">
      <button onclick="downloadPositions('json')">Download as JSON</button>
      <button onclick="downloadPositions('csv')">Download as CSV</button>
      <div class="separator"></div>
      <button onclick="loadPositionsFromFile()">Load from File...</button>
    </div>
  </div>
  <input type="file" id="file-input" accept=".json,.csv" style="display:none" onchange="handleFileLoad(event)">
</div>

<div id="canvas-wrapper">
  <div id="canvas">
    <svg id="svg-layer"></svg>
  </div>
</div>

<div id="er-group-legend">
  <div class="er-legend-box">
    <div class="er-legend-header" id="er-legend-header">
      <span>グループ凡例</span>
      <span id="er-legend-arrow">▲</span>
    </div>
    <div class="er-legend-content" id="er-legend-content"></div>
  </div>
</div>

<!-- 座標出力モーダル -->
<div class="pos-modal-overlay" id="exportModal">
  <div class="pos-modal" onclick="event.stopPropagation()">
    <div class="pos-modal-header">
      <span class="pos-modal-title">各エンティティの座標（JSON）</span>
      <button class="pos-modal-close" onclick="closeExportModal()">&times;</button>
    </div>
    <div class="pos-modal-body">
      <textarea class="pos-modal-textarea" id="exportTextarea" readonly></textarea>
    </div>
    <div class="pos-modal-footer">
      <button id="exportCopyBtn" onclick="copyExportJson()">コピー</button>
      <button onclick="closeExportModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- 座標入力モーダル -->
<div class="pos-modal-overlay" id="importModal">
  <div class="pos-modal" onclick="event.stopPropagation()">
    <div class="pos-modal-header">
      <span class="pos-modal-title">座標を入力（JSON）</span>
      <button class="pos-modal-close" onclick="closeImportModal()">&times;</button>
    </div>
    <div class="pos-modal-body">
      <textarea class="pos-modal-textarea" id="importTextarea"
        placeholder='{"user_sessions":{"x":50,"y":40},"teams":{"x":50,"y":340},...}'></textarea>
      <div class="pos-modal-feedback" id="importFeedback"></div>
    </div>
    <div class="pos-modal-footer">
      <button onclick="closeImportModal()">キャンセル</button>
      <button class="btn-primary" onclick="applyImportJson()">適用</button>
    </div>
  </div>
</div>

<!-- テーブルデータプレビューモーダル -->
<div class="td-modal-overlay" id="tdModal" onclick="if(event.target===this)closeTdModal()">
  <div class="td-modal" onclick="event.stopPropagation()">
    <div class="td-modal-header">
      <div>
        <div class="td-modal-title" id="tdModalTitle"></div>
        <div class="td-modal-sub" id="tdModalSub"></div>
      </div>
      <button class="td-modal-close" onclick="closeTdModal()">&times;</button>
    </div>
    <div class="td-modal-body" id="tdModalBody"></div>
  </div>
</div>

<div class="legend">
  <div class="legend-section-title">Groups (click to focus)</div>
  <button class="legend-row" data-group="all" onclick="focusOnGroup('all')">
    <div class="legend-dot" style="background:#8b949e"></div> すべて

  "uuid_history":               { "x": 3300, "y": 40 }
};

let positions = {};
let tableElements = {};
let currentScale = 1;
let currentTx = 0;
let currentTy = 0;

function renderTables(schema) {
  const canvas = document.getElementById('canvas');
  const tapEnabled = isHeaderTapEnabled();
  for (const table of schema) {
    const el = createTableElement(table);
    canvas.appendChild(el);
    tableElements[table.name] = el;
    const pos = positions[table.name] || { x: 0, y: 0 };
    positions[table.name] = pos;
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    if (!tapEnabled) {
      const h = el.querySelector('.er-table-header');
      if (h) { h.style.cursor = 'grab'; h.style.filter = ''; }
    }
    makeDraggable(el, table.name);
  }
  requestAnimationFrame(drawRelations);
}

function adaptApiData(apiData) {
  const fkColSet = new Set();
  for (const rel of apiData.relations) {
    fkColSet.add(rel[0] + '.' + rel[1]);
  }
  const schema = apiData.tables.map(t => ({
    name: t.name,
    cols: t.cols.map(col => {
      const c = { n: col.name, t: col.type };
      if (col.keys.includes('pk')) c.pk = true;
      if (col.keys.includes('fk') || fkColSet.has(t.name + '.' + col.name)) c.fk = true;
      if (col.keys.includes('uk')) c.uk = true;
      if (col.keys.includes('idx') && !col.keys.includes('pk') && !col.keys.includes('uk')) c.idx = true;
      return c;
    })
  }));
  const relations = apiData.relations.map(rel => ({
    from: rel[0], fromCol: rel[1], to: rel[2], toCol: rel[3]
  }));
  return { schema, relations };
}

function init() {
  const saved = localStorage.getItem('er-positions-oauth1');
  positions = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_POSITIONS));

  fetch('/api/status/schema')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(apiData => {
      if (apiData.tables && apiData.relations) {
        const adapted = adaptApiData(apiData);
        SCHEMA = adapted.schema;
        RELATIONS = adapted.relations;
      }
      renderTables(SCHEMA);
    })
    .catch(() => renderTables(SCHEMA));
}

function createTableElement(table) {
  const el = document.createElement('div');
  const groupKey = groupKeyOf(table.name);
  el.className = 'er-table' + (groupKey ? ' group-' + groupKey : '');
  el.id = 'table-' + table.name;

  const color = groupOf(table.name);

  let headerHTML = `<div class="er-table-header">
    <span class="group-dot" style="background:${color}"></span>
    ${table.name}
  </div>`;

  let bodyHTML = '<div class="er-table-body">';
  for (const col of table.cols) {
    let badges = '';
    if (col.pk) badges += '<span class="col-badge pk">PK</span>';
    if (col.fk) badges += '<span class="col-badge fk">FK</span>';
    if (col.uk) badges += '<span class="col-badge uk">UK</span>';
    if (col.idx && !col.pk && !col.uk) badges += '<span class="col-badge idx">IDX</span>';
    bodyHTML += `<div class="er-col" data-col="${col.n}">
      ${badges}
      <span class="col-name">${col.n}</span>
      <span class="col-type">${col.t}</span>
    </div>`;
  }
  bodyHTML += '</div>';

  el.innerHTML = headerHTML + bodyHTML;
  return el;
}

function escapeHtmlForTd(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function isHeaderTapEnabled() {

  var val = m ? decodeURIComponent(m[2]) : 'on';

}

function showTableDataModal(tableName) {
  if (!isHeaderTapEnabled()) return;

  const overlay = document.getElementById('tdModal');
  const titleEl = document.getElementById('tdModalTitle');
  const subEl = document.getElementById('tdModalSub');
  const bodyEl = document.getElementById('tdModalBody');
  if (!overlay || !titleEl || !bodyEl) return;

  titleEl.textContent = tableName + ' の保存データ';
  if (subEl) subEl.textContent = '';
  bodyEl.innerHTML = '<div class="td-modal-empty">最新20件を取得しています...</div>';
  overlay.classList.add('show');

  fetch('/api/status/tables/' + encodeURIComponent(tableName) + '/rows')
    .then(function(res) {
      if (res.status === 401 || res.status === 403) throw Object.assign(new Error('auth'), { isAuth: true });
      return res.json();
    })
    .then(function(data) {
      if (subEl) {
        var sub = data.description || '';
        if (data.migration) sub += (sub ? ' / ' : '') + 'マイグレーション ' + data.migration;
        subEl.textContent = sub;
      }
      var columns = data.columns || [];
      var rows = data.rows || [];
      var limit = data.limit || 20;
      var keyInfo = data.columnKeyInfo || {};
      if (rows.length === 0) {
        bodyEl.innerHTML = '<div class="td-modal-empty">表示できる保存データがありません</div>';
        return;
      }
      var badgeTypes = ['pk', 'fk', 'uk', 'idx'];
      var headerHtml = columns.map(function(col) {
        var kt = keyInfo[col];
        var badges = '';
        if (kt) {
          var parts = kt.indexOf('+') !== -1 ? kt.split('+') : [kt];
          parts.forEach(function(p) {
            if (badgeTypes.indexOf(p) !== -1) badges += '<span class="td-badge ' + p + '">' + p.toUpperCase() + '</span>';
          });
        }
        return '<th>' + escapeHtmlForTd(col) + badges + '</th>';
      }).join('');
      var bodyHtml = rows.map(function(row) {
        return '<tr>' + columns.map(function(col) {
          var v = row[col];
          return '<td>' + escapeHtmlForTd(v == null ? 'NULL' : v) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      bodyEl.innerHTML = '<div class="td-modal-note">最新 ' + limit + ' 件を表示しています</div>'
        + '<div style="overflow-x:auto"><table class="td-preview-table"><thead><tr>'
        + headerHtml + '</tr></thead><tbody>' + bodyHtml + '</tbody></table></div>';
    })
    .catch(function(err) {
      if (err && err.isAuth) {
        bodyEl.innerHTML = '<div class="td-modal-empty">ログインが必要です。'
          + '<a href="/status" style="color:var(--accent)">キャッシュ状況ページ</a>からログインするとデータを確認できます。'
          + '<br><span style="font-size:11px;color:var(--text-muted)">（ヘッダータップ機能を無効にするには<a href="/settings" style="color:var(--accent)">設定ページ</a>の「ER図テーブルヘッダータップ」をOFFにしてください）</span>'
          + '</div>';
      } else {
        bodyEl.innerHTML = '<div class="td-modal-empty">データの取得に失敗しました</div>';
      }
    });
}

function makeDraggable(el, tableName) {
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    const startX = e.clientX;
    const startY = e.clientY;
    const origX = positions[tableName].x;
    const origY = positions[tableName].y;
    const isHeader = !!e.target.closest('.er-table-header');
    let hasMoved = false;

    function onMove(e2) {
      e2.preventDefault();
      const dx = (e2.clientX - startX) / (currentScale || 1);
      const dy = (e2.clientY - startY) / (currentScale || 1);
      if (Math.abs(e2.clientX - startX) > 4 || Math.abs(e2.clientY - startY) > 4) hasMoved = true;
      const newX = Math.max(0, origX + dx);
      const newY = Math.max(0, origY + dy);
      positions[tableName].x = newX;
      positions[tableName].y = newY;
      el.style.left = newX + 'px';
      el.style.top = newY + 'px';
      drawRelations();
    }

    function onUp(e3) {
      el.releasePointerCapture(e3.pointerId);
      el.classList.remove('dragging');
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      localStorage.setItem('er-positions-oauth1', JSON.stringify(positions));
      if (isHeader && !hasMoved) showTableDataModal(tableName);
    }

    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
  });
}

function ensureArrowheadDefs(svg) {
  if (svg.querySelector('defs #arrowhead')) return;
  const defs = svg.querySelector('defs') || document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  marker.setAttribute('id', 'arrowhead');
  marker.setAttribute('markerWidth', '8');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('refX', '8');
  marker.setAttribute('refY', '3');
  marker.setAttribute('orient', 'auto');
  const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  polygon.setAttribute('points', '0 0, 8 3, 0 6');
  const lineColor = getComputedStyle(document.documentElement).getPropertyValue('--line-color').trim() || '#8b949e';
  polygon.setAttribute('fill', lineColor);
  marker.appendChild(polygon);
  defs.appendChild(marker);
  if (!svg.querySelector('defs')) svg.insertBefore(defs, svg.firstChild);
}

function drawRelations() {
  const svg = document.getElementById('svg-layer');

  // defsは保持したまま、line/text要素のみ削除
  Array.from(svg.children).forEach(c => { if (c.tagName !== 'defs') c.remove(); });

  // defsとマーカーをlines描画前に確保
  ensureArrowheadDefs(svg);

  for (const rel of RELATIONS) {
    const fromEl = tableElements[rel.from];
    const toEl = tableElements[rel.to];
    if (!fromEl || !toEl) continue;
    if (fromEl.style.display === 'none' || toEl.style.display === 'none') continue;

    const fw = fromEl.offsetWidth, fh = fromEl.offsetHeight;
    const tw = toEl.offsetWidth,   th = toEl.offsetHeight;
    if (!fw || !fh || !tw || !th) continue;

    const fromRect = { x: positions[rel.from].x, y: positions[rel.from].y, w: fw, h: fh };
    const toRect   = { x: positions[rel.to].x,   y: positions[rel.to].y,   w: tw, h: th };

    const fromCx = fromRect.x + fromRect.w / 2;
    const fromCy = fromRect.y + fromRect.h / 2;
    const toCx = toRect.x + toRect.w / 2;
    const toCy = toRect.y + toRect.h / 2;

    const fromPt = edgePoint(fromRect, toCx, toCy);
    const toPt = edgePoint(toRect, fromCx, fromCy);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', fromPt.x);
    line.setAttribute('y1', fromPt.y);
    line.setAttribute('x2', toPt.x);
    line.setAttribute('y2', toPt.y);
    line.setAttribute('marker-end', 'url(#arrowhead)');
    svg.appendChild(line);

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', (fromPt.x + toPt.x) / 2);
    label.setAttribute('y', (fromPt.y + toPt.y) / 2 - 4);
    label.setAttribute('text-anchor', 'middle');
    label.classList.add('fk-label');
    label.textContent = rel.fromCol;
    svg.appendChild(label);
  }
}

function edgePoint(rect, targetX, targetY) {
  const cx = rect.x + rect.w / 2;
  const cy = rect.y + rect.h / 2;
  const dx = targetX - cx;
  const dy = targetY - cy;

  if (dx === 0 && dy === 0) return { x: cx, y: cy };

  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  const hw = rect.w / 2;
  const hh = rect.h / 2;

  let scale;
  if (absDx * hh > absDy * hw) {
    scale = hw / absDx;
  } else {
    scale = hh / absDy;
  }

  return { x: cx + dx * scale, y: cy + dy * scale };
}

let activeFilter = 'all';

function filterGroup(group) {
  activeFilter = group;
  document.getElementById('group-menu').classList.remove('show');

  for (const table of SCHEMA) {
    const el = tableElements[table.name];
    const key = groupKeyOf(table.name);
    if (group === 'all' || key === group) {
      el.style.display = '';
    } else {
      el.style.display = 'none';
    }
  }
  drawRelations();
  focusOnGroup(group);
}

function filterGroupWithRelations(groupKey) {
  activeFilter = groupKey;
  document.getElementById('group-menu').classList.remove('show');

  const primarySet = {};
  for (const table of SCHEMA) {
    if (groupKeyOf(table.name) === groupKey) primarySet[table.name] = true;
  }

  const expanded = Object.assign({}, primarySet);
  let changed = true;
  while (changed) {
    changed = false;
    for (const rel of RELATIONS) {
      if (expanded[rel.from] && !expanded[rel.to]) { expanded[rel.to] = true; changed = true; }
      if (expanded[rel.to] && !expanded[rel.from]) { expanded[rel.from] = true; changed = true; }
    }
  }

  for (const table of SCHEMA) {
    const el = tableElements[table.name];
    el.style.display = expanded[table.name] ? '' : 'none';
  }
  drawRelations();
  focusOnGroup(groupKey);
}

function downloadPositions(format) {
  document.getElementById('save-menu').classList.remove('show');

  let content, filename, mime;

  if (format === 'json') {
    const ordered = {};
    for (const table of SCHEMA) {
      const p = positions[table.name];
      ordered[table.name] = { x: Math.round(p.x), y: Math.round(p.y) };
    }
    content = JSON.stringify(ordered, null, 2);
    filename = 'er-diagram-positions.json';
    mime = 'application/json';
  } else {
    const lines = ['table_name,x,y'];
    for (const table of SCHEMA) {
      const p = positions[table.name];
      lines.push(`${table.name},${Math.round(p.x)},${Math.round(p.y)}`);
    }
    content = lines.join('\n');
    filename = 'er-diagram-positions.csv';
    mime = 'text/csv';
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function handleFileLoad(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    let newPositions = {};

    if (file.name.endsWith('.json')) {
      try {
        newPositions = JSON.parse(text);
      } catch (err) {
        alert('Invalid JSON file');
        return;
      }
    } else if (file.name.endsWith('.csv')) {
      const lines = text.trim().split('\n');
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',');
        if (parts.length >= 3) {
          newPositions[parts[0].trim()] = {
            x: parseInt(parts[1], 10),
            y: parseInt(parts[2], 10)
          };
        }
      }
    } else {
      alert('Unsupported file format. Use .json or .csv');
      return;
    }

    applyPositions(newPositions);
  };
  reader.readAsText(file);
  event.target.value = '';
}

function applyPositions(newPositions) {
  for (const table of SCHEMA) {
    if (newPositions[table.name]) {
      positions[table.name] = newPositions[table.name];
      const el = tableElements[table.name];
      el.style.left = positions[table.name].x + 'px';
      el.style.top = positions[table.name].y + 'px';
    }
  }
  localStorage.setItem('er-positions-oauth1', JSON.stringify(positions));
  drawRelations();
  setViewMode(viewMode, true);
}

function resetPositions() {
  positions = JSON.parse(JSON.stringify(DEFAULT_POSITIONS));
  applyPositions(positions);
}

function currentPositionsJson() {
  const includeGroup = getErJsonIncludeGroup() !== 'off';
  const ordered = {};
  for (const table of SCHEMA) {
    const p = positions[table.name];
    const entry = { x: Math.round(p.x), y: Math.round(p.y) };
    if (includeGroup) {
      const groupKeys = [];
      const groupColorVals = [];
      for (const [gKey, gData] of Object.entries(GROUPS)) {
        if (gData.tables.includes(table.name)) {
          groupKeys.push(gKey);
          groupColorVals.push(gData.color);
        }
      }
      if (groupKeys.length > 0) {
        entry.groups = groupKeys;
        entry.colors = groupColorVals;
      }
    }
    ordered[table.name] = entry;
  }
  return JSON.stringify(ordered, null, 2);
}

function validatePositionJson(text) {
  if (!text.trim()) return { ok: false, error: 'JSONが入力されていません' };

  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return { ok: false, error: 'JSONの構文エラー: ' + e.message };
  }

  if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
    return { ok: false, error: 'JSONはオブジェクト形式 { "テーブル名": { "x": 数値, "y": 数値 }, ... } で入力してください' };
  }

  const tableNames = SCHEMA.map(t => t.name);
  const unknownTables = [];
  const invalidEntries = [];

  for (const [key, val] of Object.entries(parsed)) {
    if (!tableNames.includes(key)) {
      unknownTables.push(key);
    } else if (
      typeof val !== 'object' || val === null ||
      typeof val.x !== 'number' || typeof val.y !== 'number' ||
      !isFinite(val.x) || !isFinite(val.y)
    ) {
      invalidEntries.push(key);
    }
  }

  if (invalidEntries.length > 0) {
    return { ok: false, error: '以下のエントリで x / y が数値ではありません: ' + invalidEntries.join(', ') };
  }

  const matchedCount = Object.keys(parsed).filter(k => tableNames.includes(k)).length;
  if (matchedCount === 0) {
    return { ok: false, error: '既知のテーブル名と一致するエントリがありません。テーブル名を確認してください' };
  }

  return { ok: true, data: parsed, unknownTables, matchedCount };
}

function applyImportJson() {
  const ta = document.getElementById('importTextarea');
  const fb = document.getElementById('importFeedback');
  if (!ta || !fb) return;

  const result = validatePositionJson(ta.value);

  if (!result.ok) {
    fb.textContent = '⚠ ' + result.error;
    fb.className = 'pos-modal-feedback error';
    ta.className = 'pos-modal-textarea error';
    ta.focus();
    return;
  }

  ta.className = 'pos-modal-textarea';
  let warnMsg = '';
  if (result.unknownTables.length > 0) {
    warnMsg = '⚠ 不明なテーブル名（スキップ）: ' + result.unknownTables.join(', ');
  }

  applyPositions(result.data);

  if (warnMsg) {
    fb.textContent = warnMsg;
    fb.className = 'pos-modal-feedback warn';
  } else {
    fb.textContent = '✓ ' + result.matchedCount + ' 件のエンティティ座標を適用しました';
    fb.className = 'pos-modal-feedback ok';
    setTimeout(closeImportModal, 1200);
  }
}

function computeBBox(tableNames) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  let found = 0;
  for (const name of tableNames) {
    const el = tableElements[name];
    if (!el || el.style.display === 'none') continue;
    const p = positions[name];
    if (!p) continue;
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + el.offsetWidth);
    maxY = Math.max(maxY, p.y + el.offsetHeight);
    found++;
  }
  if (found === 0) return null;
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

function applyViewport(bbox, animate) {
  if (!bbox) return;
  const wrapper = document.getElementById('canvas-wrapper');
  const canvas = document.getElementById('canvas');
  const pad = 60;
  const viewW = wrapper.clientWidth;
  const viewH = wrapper.clientHeight;
  const contentW = bbox.w + pad * 2;
  const contentH = bbox.h + pad * 2;
  const scale = Math.min(viewW / contentW, viewH / contentH, 1.5);
  const tx = (viewW - bbox.w * scale) / 2 - bbox.x * scale;
  const ty = (viewH - bbox.h * scale) / 2 - bbox.y * scale;

  if (animate) {
    canvas.classList.add('animating');
  } else {
    canvas.classList.remove('animating');
  }
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  currentScale = scale;
  currentTx = tx;
  currentTy = ty;
  updateZoomInfo();

  if (animate) {
    setTimeout(() => canvas.classList.remove('animating'), 650);
  }
}

function updateZoomInfo() {
  const info = document.getElementById('zoom-info');
  if (info) info.textContent = `Zoom ${Math.round(currentScale * 100)}%`;
}

function fitToView(animate = true) {
  const visibleTables = SCHEMA
    .filter((t) => tableElements[t.name] && tableElements[t.name].style.display !== 'none')
    .map((t) => t.name);
  const bbox = computeBBox(visibleTables);
  applyViewport(bbox, animate);
}

let viewMode = 'overview';

function applyFocusView(animate) {
  const canvas = document.getElementById('canvas');
  if (animate) {
    canvas.classList.add('animating');
  } else {
    canvas.classList.remove('animating');
  }
  canvas.style.transform = 'translate(0px, 0px) scale(1)';
  currentScale = 1;
  currentTx = 0;
  currentTy = 0;
  updateZoomInfo();
  if (animate) {
    setTimeout(() => canvas.classList.remove('animating'), 650);
  }
}

function updateViewModeButtons() {
  const focusBtn = document.getElementById('view-mode-focus');
  const overviewBtn = document.getElementById('view-mode-overview');
  if (focusBtn) focusBtn.classList.toggle('active', viewMode === 'focus');
  if (overviewBtn) overviewBtn.classList.toggle('active', viewMode === 'overview');
}

function setViewMode(mode, animate = true) {
  if (mode !== 'focus' && mode !== 'overview') return;
  viewMode = mode;
  updateViewModeButtons();
  if (mode === 'focus') {
    applyFocusView(animate);
  } else {
    fitToView(animate);
  }
}

function focusOnGroup(groupKey) {
  document.querySelectorAll('.legend-row').forEach((el) => {
    el.classList.toggle('active', el.dataset.group === groupKey);
  });

  // ensure all tables are visible so focus works even after filter usage
  for (const table of SCHEMA) {
    const el = tableElements[table.name];
    if (el) el.style.display = '';
  }
  activeFilter = 'all';
  drawRelations();

  let tableNames;
  if (groupKey === 'all') {
    tableNames = SCHEMA.map((t) => t.name);
  } else {
    const g = GROUPS[groupKey];
    if (!g) return;
    tableNames = g.tables.slice();
  }
  const bbox = computeBBox(tableNames);
  applyViewport(bbox, true);
  viewMode = 'overview';
  updateViewModeButtons();
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (viewMode === 'focus') {
      applyFocusView(false);
    } else {
      fitToView(false);
    }
  }, 150);
});

window.addEventListener('DOMContentLoaded', () => {
  init();
  setTimeout(() => {
    setViewMode('overview', false);
    const allRow = document.querySelector('.legend-row[data-group="all"]');
    if (allRow) allRow.classList.add('active');
  }, 50);
});

// ===== グループ凡例 =====
(function() {
  function getErLegendVisible() {
    var m = document.cookie.match('(^|;)\\s*er_legend_visible=([^;]*)');
    return m ? decodeURIComponent(m[2]) !== 'off' : true;
  }

  function setErLegendVisible(visible) {
    document.cookie = 'er_legend_visible=' + (visible ? 'on' : 'off') + '; Path=/; Secure; SameSite=Lax; Max-Age=31536000';
    applyErLegendVisible(visible);
  }

  function applyErLegendVisible(visible) {
    var content = document.getElementById('er-legend-content');
    var arrow = document.getElementById('er-legend-arrow');
    if (content) content.style.display = visible ? '' : 'none';
    if (arrow) arrow.textContent = visible ? '▲' : '▼';
  }

  function buildErLegendItems() {
    var container = document.getElementById('er-legend-content');
    if (!container) return;

    var allRow = document.createElement('div');
    allRow.className = 'er-legend-row';
    var allSwatch = document.createElement('div');
    allSwatch.className = 'er-legend-swatch';
    allSwatch.style.background = 'linear-gradient(135deg,#388bfd,#3fb950,#d29922,#f85149,#a371f7)';
    var allName = document.createElement('span');
    allName.className = 'er-legend-name';
    allName.textContent = 'すべて';
    allRow.appendChild(allSwatch);
    allRow.appendChild(allName);
    allRow.addEventListener('click', function(e) {
      e.stopPropagation();
      filterGroup('all');
    });
    container.appendChild(allRow);

    for (var key in GROUPS) {
      (function(groupKey) {
        var g = GROUPS[groupKey];
        var row = document.createElement('div');
        row.className = 'er-legend-row';
        var swatch = document.createElement('div');
        swatch.className = 'er-legend-swatch';
        swatch.style.background = g.color;
        var name = document.createElement('span');
        name.className = 'er-legend-name';
        name.textContent = g.label || groupKey;
        var code = document.createElement('span');
        code.className = 'er-legend-code';
        code.textContent = g.color;
        row.appendChild(swatch);
        row.appendChild(name);
        row.appendChild(code);
        row.addEventListener('click', function(e) {
          e.stopPropagation();
          filterGroupWithRelations(groupKey);
        });
        container.appendChild(row);
      })(key);
    }
  }

  buildErLegendItems();
  applyErLegendVisible(getErLegendVisible());

  var legendHeader = document.getElementById('er-legend-header');
  if (legendHeader) {
    legendHeader.addEventListener('click', function(e) {
      e.stopPropagation();
      setErLegendVisible(!getErLegendVisible());
    });
  }
})();
</script>
</body>
