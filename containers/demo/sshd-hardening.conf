# demoコンテナのsshdの初期設定。Dockerfileが/etc/ssh/sshd_config.d/10-hardening.confに置く。
# sshd_configの先頭のIncludeで読まれ、同じ項目は最初の値が勝つので、Ubuntuの既定より優先される。

# 公開鍵だけでログインする
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
AuthorizedKeysFile .ssh/authorized_keys

# ホスト鍵はed25519だけを見せる。SSH_HOST_ED25519_KEY_B64で引き継ぐ鍵と同じ
HostKey /etc/ssh/ssh_host_ed25519_key

# 総当たりと放置された接続を減らす
LoginGraceTime 30
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 2

# トンネルとTailscaleの接続はどれも127.0.0.1から来る。ここを罰すると全員が締め出される
PerSourcePenaltyExemptList 127.0.0.1/32,::1/128

# 使っていない機能を切る
X11Forwarding no
PermitUserEnvironment no
PermitTunnel no
