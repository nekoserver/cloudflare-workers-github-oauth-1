# Redmine(Passenger経由)を127.0.0.1のみで待ち受ける内部専用VirtualHost。
# 外部(cloudflaredのnekorootトンネル、apache-demo.confの8443)には出さない。
# server.js(ポート8080、/cf-containers/proxy/*の認証済み管理プロキシの着地点)が
# /redmine prefixを剥いだ上でこのポートへ内部的にプロキシする。Worker側の認証
# (cfDashboardAdminMiddleware)を経由した場合のみ到達できる。
#
# このVirtualHost内ではRedmineをルート直下にマウントする(PassengerBaseURIは使わない)。
# 外部から見える実際のパス(/cf-containers/proxy/redmine/...)に合わせたリンク生成は
# RAILS_RELATIVE_URL_ROOT(entrypoint.shが環境変数で渡す)でRedmine自身に行わせる。
Listen 127.0.0.1:8444

<VirtualHost 127.0.0.1:8444>
    ServerName localhost
    DocumentRoot /opt/redmine/public

    <Directory /opt/redmine/public>
        Options -MultiViews
        Require all granted
        PassengerAppEnv production
    </Directory>

    ErrorLog /var/log/apache2/redmine-error.log
    CustomLog /var/log/apache2/redmine-access.log common
</VirtualHost>
