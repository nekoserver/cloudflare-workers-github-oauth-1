# nekorootトンネル(cloudflared)から転送されるリクエストを受けるApache
# VirtualHost。TLSは自己署名証明書(entrypoint.shが起動時に生成)。
# server.js(ポート8080)へプロキシする。WebSocketアップグレードは
# proxy_wstunnelで、SSE(chunked転送)はSetEnv proxy-sendchunked/
# proxy-sendcl未使用のままデフォルトのストリーミング転送で通す。
# ports.confのデフォルト(80/443)には8443が無いため、ここで明示的に待ち受ける。
Listen 8443
ServerName localhost

<VirtualHost *:8443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/tls/nekoroot.crt
    SSLCertificateKeyFile /etc/apache2/tls/nekoroot.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # cloudflared connects locally (see cloudflared-ingress.yml.template).
    # Only local proxies may supply the Cloudflare client IP; direct remote
    # connections cannot override their address with a forged header.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 127.0.0.1 ::1

    # Diagnostics remain available only through the authenticated management
    # proxy on :8080; the public tunnel must not expose logs or network probes.
    # lib (SSI, apache-lib.conf) is for administrators only, via the same proxy
    # (user decision 2026-11-11), so the public tunnel refuses /lib as well.
    <LocationMatch "^/(?:debug|admin|lib)(?:/|$)">
        Require all denied
    </LocationMatch>

    ProxyRequests Off
    ProxyPreserveHost On

    # WebSocket(Upgrade: websocket)はwstunnelへ、それ以外は通常のhttpへ。
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/lib/api/chat/ws$
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8080/$1 [P,L]

    ProxyPass / http://127.0.0.1:8080/ retry=0
    ProxyPassReverse / http://127.0.0.1:8080/

    # SSE等のストリーミング応答をApache側でバッファしない。
    SetEnv proxy-sendcl 0
    SetEnv no-gzip 1

    ErrorLog /var/log/apache2/nekoroot-error.log
    # %a is the resolved client IP; %{c}a preserves the actual connection peer.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" peer=%{c}a" nekoroot_combined
    CustomLog /var/log/apache2/nekoroot-access.log nekoroot_combined
</VirtualHost>
