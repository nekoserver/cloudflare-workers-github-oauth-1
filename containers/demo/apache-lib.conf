# lib(nekoserver/lib)のSSIを127.0.0.1のみで処理する内部専用VirtualHost。
# 外部(cloudflaredのnekorootトンネル、apache-demo.confの8443)には出さない(8443側は/libを拒否する)。
# server.js(ポート8080、/cf-containers/proxy/*の認証済み管理プロキシの着地点)が
# /lib をそのままこのポートへ内部的にプロキシする。Worker側の認証
# (authMiddleware + cfDashboardAdminMiddleware)を経由した場合のみ到達できる(ユーザー指定、2026-11-11「管理者だけ」)。
#
# /var/www/html/lib は entrypoint.sh が /root/lib をbind mountして用意する。無ければ404になる。
# SSI(#execを含む)とCGI(.cgi)の許可は、このVirtualHostの中で明示する(container_setup.pyのcontainer-ssi.confはSSIだけ)。
Listen 127.0.0.1:8445

<VirtualHost 127.0.0.1:8445>
    ServerName localhost
    DocumentRoot /var/www/html
    # 断片(.shtml)を単体で開いた場合、断片側にはcharsetの宣言を置けないため、
    # 応答ヘッダでutf-8を付ける。無いとブラウザが推測でデコードして文字化けする。
    AddDefaultCharset utf-8

    # 実行経路の状態の置き場所(SPEC.lib.muse.execution-path 版3、REQ-EP-034)。
    # CGI は www-data、承認は root で動き、ホームが分かれる。実行ユーザーの
    # ホームに任せると受付と承認で置き場所が噛み合わない(2026-11-19 実測で
    # 受付が 500)ため、置き場所と運用ホームを CGI の環境へ明示して渡す。
    # 実体(/var/lib/muse-sdk、www-data が書けること)と既定ワークスペースは
    # entrypoint が用意する。
    SetEnv MUSE_SDK_BASE /var/lib/muse-sdk
    SetEnv MUSE_SDK_HOME /root

    # ダッシュボードのサイドパネル(SPEC.lib.dashboard-state.shtml 版2、REQ-PN-006)。
    # 表示選択の Cookie を SSI の #if で使うため、環境変数へ写す。LIBDASH_OFF は
    # 既定でカンマ1つ(どの区画 id にも一致しない値)を立て、Cookie があれば上書きする。
    SetEnvIf Request_URI "^/" LIBDASH_OFF=","
    SetEnvIf Cookie "libdash_off=([^;]*)" LIBDASH_OFF=$1
    SetEnvIf Cookie "libdash_layout=([^;]*)" LIBDASH_LAYOUT=$1

    <Directory /var/www/html>
        Require all denied
    </Directory>

    <Directory /var/www/html/lib>
        # SSIの#exec(lib/museのダッシュボードなど)とCGI(.cgi)を実行できるようにする。
        Options +Includes +ExecCGI -Indexes -MultiViews
        AllowOverride None
        # ダッシュボードのパネルの #if は旧式パーサの文法で書く(SPEC.lib.dashboard-state.shtml
        # 版2の前提 P8)。新しい式パーサ(ap_expr)では SetEnvIf で立てた変数を #if から
        # 参照できず "Variable does not exist" で落ちるため、旧式パーサを明示する。
        SSILegacyExprParser On
        AddType text/html .shtml .shtm
        AddOutputFilter INCLUDES .shtml .shtm
        AddHandler cgi-script .cgi
        Require local
    </Directory>

    # 会話ストリーム(tree-viewのワーカータブ、本体の /api/tree-view/conversation-stream-external/lib/* → server.js → ここ)を、
    # libのストリームのサーバー(127.0.0.1の8091・8092)へ中継する。認証はストリームのサーバーが行う(ログイン・HMACのセッション)。
    # Hostを保つ: libのセッションはHostからHTTPSのoriginを導くため、書き換えると認証後の確認が403になる。
    # WebSocketの規則は /lib/api/chat/ より前に置く(ProxyPassは先に一致したものを使う)。それ以外の/libは中継しない。
    ProxyPreserveHost On
    ProxyPass /lib/api/chat/ws ws://127.0.0.1:8091/lib/api/chat/ws retry=0 timeout=600
    ProxyPass /lib/api/chat/ http://127.0.0.1:8092/lib/api/chat/ retry=0 timeout=600
    ProxyPass /lib/conversation-embed.html http://127.0.0.1:8092/lib/conversation-embed.html retry=0
    ProxyPass /lib/chat/ http://127.0.0.1:8092/lib/chat/ retry=0
    ProxyPass /lib/t/ http://127.0.0.1:8092/lib/t/ retry=0
    <Proxy "http://127.0.0.1:8092">
        ProxySet flushpackets=on
    </Proxy>

    ErrorLog /var/log/apache2/lib-error.log
    CustomLog /var/log/apache2/lib-access.log common
</VirtualHost>
